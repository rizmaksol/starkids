<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1D9E75">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.json">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--g:#1D9E75;--gd:#0F6E56;--gl:#E1F5EE;--gb:#5DCAA5;--p:#534AB7;--pl:#EEEDFE;--pb:#AFA9EC;--a:#BA7517;--al:#FAEEDA;--ab:#FAC775;--r:#E24B4A;--t:#1a1a1a;--t2:#555;--t3:#999;--bg:#fff;--bg2:#f7f7f5;--bg3:#f0eeea;--bd:rgba(0,0,0,0.11);--bd2:rgba(0,0,0,0.2);--rad:10px;--radl:14px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--t)}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
.screen{display:none;flex-direction:column;min-height:100vh}
.screen.active{display:flex}
.topbar{padding:13px 15px 11px;background:var(--bg);border-bottom:0.5px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;z-index:10}
.tb-t{font-size:15px;font-weight:600;color:var(--t)}
.tb-s{font-size:11px;color:var(--t3);margin-top:1px}
.content{flex:1;overflow-y:auto;padding:12px 14px;-webkit-overflow-scrolling:touch}
.bbar{padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:0.5px solid var(--bd);display:flex;gap:8px;flex-shrink:0;background:var(--bg)}
.btn{padding:9px 14px;border-radius:var(--rad);border:0.5px solid var(--bd2);background:var(--bg);color:var(--t);font-size:13px;cursor:pointer;flex:1;text-align:center;font-weight:500;-webkit-appearance:none}
.btn:active{transform:scale(0.97)}
.btn.pri{background:var(--g);border-color:var(--g);color:#fff}
.btn.dan{background:var(--r);border-color:var(--r);color:#fff}
.btn.sm{flex:none;padding:5px 11px;font-size:12px}
.btn.ib{flex:none;width:28px;height:28px;padding:0;display:flex;align-items:center;justify-content:center;font-size:14px}
.tabs{display:flex;border-bottom:0.5px solid var(--bd);flex-shrink:0;overflow-x:auto;background:var(--bg)}
.tab{flex:1;min-width:56px;padding:9px 4px;text-align:center;font-size:11px;font-weight:500;cursor:pointer;color:var(--t3);border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--g);border-bottom-color:var(--g)}
.card{border:0.5px solid var(--bd);border-radius:var(--radl);padding:12px 14px;margin-bottom:8px;background:var(--bg)}
.sl{font-size:11px;font-weight:600;color:var(--t3);letter-spacing:.05em;text-transform:uppercase;margin:14px 0 7px}
.sl:first-child{margin-top:2px}
.tr{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;border:0.5px solid var(--bd);border-radius:var(--rad);margin-bottom:6px;background:var(--bg)}
.tr.done{background:var(--gl);border-color:var(--gb)}
.tr.pend{background:var(--al);border-color:var(--ab)}
.tico{font-size:17px;width:24px;text-align:center;flex-shrink:0;padding-top:2px}
.tinfo{flex:1;min-width:0}
.tname{font-size:13px;font-weight:600;color:var(--t);margin-bottom:2px}
.tsub{font-size:11px;color:var(--t3)}
.circ{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--bd2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:600;cursor:pointer}
.circ.done{background:var(--g);border-color:var(--g);color:#fff}
.circ.pend{background:var(--ab);border-color:var(--ab);font-size:11px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:6px}
.pcard{border:0.5px solid var(--bd);border-radius:var(--rad);padding:9px 12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;background:var(--bg)}
.pcard.done{background:var(--gl);border-color:var(--gb)}
.pcard.next{border-color:var(--g)}
.sbar{background:var(--bg2);border-radius:var(--rad);padding:11px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border:0.5px solid var(--bd)}
.snum{font-size:22px;font-weight:700;color:var(--g)}
.slbl{font-size:10px;color:var(--t3);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.lwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;background:var(--bg)}
.cw{display:flex;gap:7px;justify-content:center;margin:14px 0}
.cw input{width:42px;height:50px;text-align:center;font-size:22px;font-weight:700;border:1.5px solid var(--bd2);border-radius:var(--rad);padding:0;background:var(--bg);color:var(--t);-webkit-appearance:none}
.cw input:focus{border-color:var(--g);outline:none}
.codebox{background:var(--bg2);border-radius:var(--rad);padding:13px;text-align:center;margin:10px 0;border:0.5px solid var(--bd)}
.codedigits{font-size:26px;font-weight:700;letter-spacing:9px;color:var(--g);font-family:monospace}
.badge{display:inline-block;padding:2px 7px;border-radius:7px;font-size:11px;font-weight:600}
.badge.pend{background:var(--al);color:#633806}
.badge.ok{background:var(--gl);color:#085041}
.badge.pro{background:var(--pl);color:#26215C}
.badge.free{background:var(--bg2);color:var(--t2)}
.ndot{width:7px;height:7px;background:var(--r);border-radius:50%;display:inline-block;margin-left:3px;vertical-align:middle}
.info{border-radius:var(--rad);padding:10px 13px;font-size:12px;margin-bottom:10px;line-height:1.6}
.info.g{background:var(--gl);border:0.5px solid var(--gb);color:#085041}
.info.a{background:var(--al);border:0.5px solid var(--ab);color:#633806}
.info.p{background:var(--pl);border:0.5px solid var(--pb);color:#26215C}
.rcard{border:0.5px solid var(--bd);border-radius:var(--rad);padding:12px 13px;margin-bottom:7px;background:var(--bg)}
.rcard.unlocked{background:var(--gl);border-color:var(--gb)}
.rcard.given{background:var(--bg2);opacity:.7}
.rcard.selectable{border:2px solid var(--g);cursor:pointer}
.pb{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden}
.pbf{height:100%;border-radius:3px;background:var(--g)}
.seg{display:flex;border:0.5px solid var(--bd2);border-radius:var(--rad);overflow:hidden;margin-bottom:10px}
.segb{flex:1;padding:7px;font-size:12px;font-weight:500;cursor:pointer;text-align:center;background:var(--bg);color:var(--t3);border:none}
.segb.active{background:var(--g);color:#fff}
.ff{margin-bottom:11px}
.ff label{font-size:12px;color:var(--t2);display:block;margin-bottom:3px;font-weight:600}
.ff input,.ff select{width:100%;padding:8px 10px;border:0.5px solid var(--bd2);border-radius:var(--rad);font-size:13px;background:var(--bg);color:var(--t);-webkit-appearance:none}
.inp{width:100%;padding:10px 12px;border:0.5px solid var(--bd2);border-radius:var(--rad);font-size:14px;background:var(--bg);color:var(--t);-webkit-appearance:none;margin-bottom:10px}
.inp:focus{border-color:var(--g);outline:none}
.rphdr{background:var(--g);border-radius:var(--radl);padding:16px;color:#fff;text-align:center;margin-bottom:12px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.scard{border:0.5px solid var(--bd);border-radius:var(--rad);padding:11px;text-align:center;background:var(--bg)}
.sgnum{font-size:24px;font-weight:700;color:var(--g)}
.sglbl{font-size:10px;color:var(--t3);margin-top:2px;font-weight:600;text-transform:uppercase}
.dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.dcell{text-align:center;padding:5px 2px;border-radius:var(--rad);border:0.5px solid var(--bd)}
.dcell.today{border-color:var(--g);background:var(--gl)}
.unlock-banner{background:var(--g);color:#fff;border-radius:var(--rad);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:12px;color:var(--t3);font-size:14px}
.spinner{width:32px;height:32px;border:3px solid var(--bd);border-top-color:var(--g);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.togrow{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:0.5px solid var(--bd)}
.togrow:last-child{border:none}
.tog{width:38px;height:21px;border-radius:11px;border:none;cursor:pointer;position:relative;flex-shrink:0}
.tog.on{background:var(--g)}
.tog.off{background:#ccc}
.tog::after{content:'';position:absolute;width:15px;height:15px;border-radius:50%;background:#fff;top:3px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog.on::after{left:20px}
.tog.off::after{left:3px}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.saved-card{width:100%;padding:14px 16px;border:0.5px solid var(--bd);border-radius:var(--radl);cursor:pointer;display:flex;align-items:center;gap:14px;margin-bottom:10px;background:var(--bg)}
.saved-card:active{background:var(--gl)}
.kid-picker{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.kid-pick-card{border:0.5px solid var(--bd);border-radius:var(--radl);padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;background:var(--bg);text-align:center}
.kid-pick-card:active{background:var(--gl);border-color:var(--gb)}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0}
.emoji-opt{font-size:24px;text-align:center;padding:6px;border-radius:var(--rad);cursor:pointer;border:0.5px solid transparent}
.emoji-opt.selected{border-color:var(--g);background:var(--gl)}
.check-row{display:flex;align-items:center;gap:8px;margin:10px 0;cursor:pointer;font-size:13px;color:var(--t2)}
.check-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--g);cursor:pointer}
/* Photo proof area */
.proof-area{margin-top:8px;padding:8px;background:var(--bg2);border-radius:var(--rad);border:0.5px solid var(--bd)}
.proof-btns{display:flex;gap:8px;margin-bottom:0}
.proof-btn-tick{flex:1;padding:8px;border-radius:var(--rad);border:0.5px solid var(--gb);background:var(--gl);color:#085041;font-size:12px;font-weight:500;cursor:pointer;text-align:center}
.proof-btn-tick:active{transform:scale(0.97)}
.proof-btn-photo{flex:1;padding:8px;border-radius:var(--rad);border:0.5px solid var(--pb);background:var(--pl);color:#26215C;font-size:12px;font-weight:500;cursor:pointer;text-align:center;display:flex;align-items:center;justify-content:center;gap:4px}
.proof-btn-photo:active{transform:scale(0.97)}
.proof-img{width:100%;max-height:90px;object-fit:cover;border-radius:6px;margin-top:7px;display:block}
</style>
</head>
<body>
<div class="app">

<!-- HOME -->
<div class="screen active" id="s-home">
  <div class="lwrap">
    <div style="font-size:48px;margin-bottom:8px">⭐</div>
    <div style="font-size:22px;font-weight:700;margin-bottom:3px">StarKids</div>
    <div style="font-size:13px;color:var(--t3);margin-bottom:24px;text-align:center">Discipline · Habits · Rewards</div>
    <div style="width:100%" id="home-content"></div>
    <div style="margin-top:18px;font-size:11px;color:var(--t3)">StarKids v7.0</div>
  </div>
</div>

<!-- PARENT AUTH -->
<div class="screen" id="s-parent-auth">
  <div class="topbar"><div class="tb-t">Parent account</div><button class="btn sm" onclick="SS('s-home');renderHome()">Back</button></div>
  <div class="content">
    <div class="seg" id="auth-seg">
      <div class="segb active" onclick="setAuthMode('signin')">Sign in</div>
      <div class="segb" onclick="setAuthMode('signup')">Create account</div>
    </div>
    <div id="auth-form"></div>
  </div>
</div>

<!-- KID CODE -->
<div class="screen" id="s-kidcode">
  <div class="topbar"><div class="tb-t">Kid login</div><button class="btn sm" onclick="SS('s-home');renderHome()">Back</button></div>
  <div class="content" style="display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center">
    <div style="font-size:44px;margin-bottom:12px">👦</div>
    <div style="font-size:17px;font-weight:600;margin-bottom:4px">Enter your secret code</div>
    <div style="font-size:13px;color:var(--t3);margin-bottom:2px">Ask your parent for your 6-digit code</div>
    <div class="cw" id="ci"></div>
    <div id="cerr" style="font-size:12px;color:var(--r);min-height:16px;margin-bottom:10px"></div>
    <button class="btn pri" style="width:100%;max-width:260px;padding:12px" onclick="kidLogin()">Enter app</button>
  </div>
</div>

<!-- LOADING -->
<div class="screen" id="s-loading">
  <div class="loading"><div class="spinner"></div><div id="load-msg">Loading...</div></div>
</div>

<!-- PARENT MAIN -->
<div class="screen" id="s-parent">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px">
      <div id="p-av-top" onclick="SS('s-settings');renderSettings()" style="cursor:pointer"></div>
      <div><div class="tb-t" id="p-tit">Dashboard</div><div class="tb-s" id="p-sub"></div></div>
    </div>
    <div style="display:flex;gap:5px">
      <button class="btn sm" onclick="SS('s-settings');renderSettings()">⚙️</button>
      <button class="btn sm" onclick="doSignOut()">Exit</button>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" id="t-appr" onclick="pTab('appr')">Approvals<span id="adot"></span></div>
    <div class="tab" id="t-tasks" onclick="pTab('tasks')">Tasks</div>
    <div class="tab" id="t-kids" onclick="pTab('kids')">Kids</div>
    <div class="tab" id="t-rewards" onclick="pTab('rewards')">Rewards</div>
    <div class="tab" id="t-report" onclick="pTab('report')">Report</div>
  </div>
  <div class="content" id="p-body"></div>
</div>

<!-- KID MAIN -->
<div class="screen" id="s-kid">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px">
      <div id="k-av-top"></div>
      <div><div class="tb-t" id="k-tit">My tasks</div><div class="tb-s" id="k-sub"></div></div>
    </div>
    <div style="display:flex;gap:5px">
      <span id="k-stars" style="font-size:13px;font-weight:700;color:var(--g)"></span>
      <button class="btn sm" onclick="SS('s-home');renderHome()">Exit</button>
    </div>
  </div>
  <div class="content" id="k-body"></div>
  <div class="bbar">
    <button class="btn" onclick="showKidRewards()">🏆 Rewards</button>
    <button class="btn pri" onclick="submitDay()">Submit day</button>
  </div>
</div>

<!-- KID REWARD CHOOSER -->
<div class="screen" id="s-choose-reward">
  <div class="topbar"><div class="tb-t">Choose your reward 🎉</div><button class="btn sm" onclick="SS('s-kid');renderKid()">Back</button></div>
  <div class="content" id="choose-body"></div>
</div>

<!-- KID REWARDS VIEW -->
<div class="screen" id="s-krewards">
  <div class="topbar"><div class="tb-t">My Rewards</div><button class="btn sm" onclick="SS('s-kid');renderKid()">Back</button></div>
  <div class="content" id="kr-body"></div>
</div>

<!-- SETTINGS -->
<div class="screen" id="s-settings">
  <div class="topbar"><div class="tb-t">Settings</div><button class="btn sm" onclick="SS('s-parent')">Back</button></div>
  <div class="content" id="set-body"></div>
</div>

<!-- REWARD EDIT -->
<div class="screen" id="s-redit">
  <div class="topbar"><div class="tb-t" id="re-tit">Add reward</div><button class="btn sm" onclick="pTab('rewards');SS('s-parent')">Cancel</button></div>
  <div class="content" id="re-body"></div>
</div>

<!-- HIDDEN CAMERA INPUT — always present, never destroyed -->
<input type="file" id="global-camera" accept="image/*" capture="environment" style="display:none;position:absolute;left:-9999px"/>

</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut,updateProfile,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import{getFirestore,doc,setDoc,getDoc,collection,query,where,getDocs,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const FC={apiKey:"AIzaSyBRFMAu5DxyT_ORclTOWjXwkbM1EIuXVcc",authDomain:"starkids-773c3.firebaseapp.com",projectId:"starkids-773c3",storageBucket:"starkids-773c3.firebasestorage.app",messagingSenderId:"356520993318",appId:"1:356520993318:web:475977e92d5a5dbb5d3ce7"};
const fbApp=initializeApp(FC);
const auth=getAuth(fbApp);
const db=getFirestore(fbApp);

// ── CONSTANTS ─────────────────────────────────────────
const PI=[{n:'Fajr',t:'Dawn'},{n:'Dhuhr',t:'Midday'},{n:'Asr',t:'Afternoon'},{n:'Maghrib',t:'Sunset'},{n:'Isha',t:'Night'}];
const PC=[{n:'Morning prayer',t:'Start of day'},{n:'Midday prayer',t:'Noon'},{n:'Evening prayer',t:'End of day'}];
const SHD=[0,3];
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DS=['S','M','T','W','T','F','S'];
const KEMOJIS=['👦','👧','🧒','👶','🦁','🐯','🦊','🐻','🐼','🦄','🐸','🐧','🦋','⭐','🚀','⚽','🎮','🎨','🎵','🌟','🏆','💪','🧠','🌈'];
const DEF_TASKS=[
  {id:'t1',ico:'🛏',name:'Make bed',cat:'daily',stars:1},
  {id:'t2',ico:'🪥',name:'Brush teeth (morning)',cat:'daily',stars:1},
  {id:'t3',ico:'🪥',name:'Brush teeth (night)',cat:'daily',stars:1},
  {id:'t4',ico:'📚',name:'Study / reading 30 min',cat:'daily',stars:2},
  {id:'t5',ico:'🏃',name:'Outdoor play',cat:'daily',stars:1},
  {id:'t6',ico:'🧹',name:'Clean room',cat:'daily',stars:1},
  {id:'t7',ico:'❤️',name:'Help parents',cat:'daily',stars:1},
  {id:'t8',ico:'🤝',name:'Good behavior',cat:'daily',stars:1},
  {id:'t9',ico:'📺',name:'Limited TV (respected)',cat:'daily',stars:1},
  {id:'t10',ico:'🚿',name:'Shower day',cat:'daily',stars:1,showerOnly:true},
  {id:'b1',ico:'📿',name:'Memorised a dua/verse',cat:'bonus',stars:2},
  {id:'b2',ico:'🎨',name:'Drew a picture',cat:'bonus',stars:1},
  {id:'b3',ico:'📖',name:'Read a story book',cat:'bonus',stars:1},
  {id:'b4',ico:'🍳',name:'Helped cook',cat:'bonus',stars:1},
  {id:'b5',ico:'🕊️',name:'No fighting all day',cat:'bonus',stars:2},
];
const DEF_REWARDS=[
  {id:'r1',name:'Ice cream / dessert',stars:20,period:'week',type:'treat',amount:null,payType:null,given:false},
  {id:'r2',name:'Choose family movie',stars:35,period:'week',type:'treat',amount:null,payType:null,given:false},
  {id:'r3',name:'Small toy',stars:50,period:'month',type:'treat',amount:null,payType:null,given:false},
  {id:'r4',name:'Cash reward',stars:60,period:'month',type:'money',amount:20,payType:'cash',given:false},
  {id:'r5',name:'Special outing',stars:80,period:'month',type:'treat',amount:null,payType:null,given:false},
];

// ── STATE ─────────────────────────────────────────────
let G={
  pUid:null,pData:null,
  kids:[],tasks:DEF_TASKS,rewards:DEF_REWARDS,
  logs:{},pending:[],
  kid:null,religion:'islam',currency:'SAR',prayOn:true,
  editTask:null,editReward:null,repKid:null,
  pEmoji:'👨‍👩‍👧',pPhoto:null,
  apprKidTab:null,
  prayerTimes:{},prayerCity:'',
};
let _unsubParent=null,_unsubLogs=null,_unsubKidLog=null;
const LS_P='sk_p',LS_K='sk_k';

// ── CAMERA — Global persistent input ─────────────────
// Single permanent input - never destroyed - works on all Android
let _cameraCallback=null;
const camInp=document.getElementById('global-camera');

camInp.addEventListener('change',e=>{
  const file=e.target.files[0];
  if(file&&_cameraCallback){
    const reader=new FileReader();
    reader.onload=ev=>{
      const cb=_cameraCallback;
      _cameraCallback=null;
      cb(ev.target.result);
    };
    reader.readAsDataURL(file);
  } else {
    _cameraCallback=null;
  }
  camInp.value=''; // Reset for next use
});

function openCamera(callback){
  _cameraCallback=callback;
  camInp.click();
}

// ── UTILS ─────────────────────────────────────────────
window.SS=id=>{document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
const uid=()=>'x'+Date.now()+Math.floor(Math.random()*999);
const today=()=>new Date().toISOString().slice(0,10);
const dn=()=>DAYS[new Date().getDay()];

const prayers=()=>{if(!G.prayOn)return[];if(G.religion==='islam')return PI;if(G.religion==='christian')return PC;if(G.religion==='other')return[{n:'Morning prayer',t:'Your time'},{n:'Evening prayer',t:'Your time'}];return[];};
const getLog=(kidId,dk)=>{if(!G.logs[kidId])G.logs[kidId]={};if(!G.logs[kidId][dk])G.logs[kidId][dk]={prayers:{},tasks:{},photos:{},ticked:{}};return G.logs[kidId][dk];};
const calcStars=(kidId,dk)=>{const log=getLog(kidId,dk);let s=0;prayers().forEach(p=>{if(log.prayers[p.n])s++;});G.tasks.forEach(t=>{if(log.tasks[t.id]==='approved')s+=t.stars;});return s;};
const wkeys=()=>{const d=new Date();const dow=d.getDay();const k=[];for(let i=0;i<7;i++){const dd=new Date(d);dd.setDate(d.getDate()-dow+i);k.push(dd.toISOString().slice(0,10));}return k;};
const mkeys=()=>{const d=new Date();const y=d.getFullYear();const m=d.getMonth();const dm=new Date(y,m+1,0).getDate();const k=[];for(let i=1;i<=dm;i++)k.push(`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`);return k;};
const wStars=id=>wkeys().reduce((a,k)=>a+calcStars(id,k),0);
const mStars=id=>mkeys().reduce((a,k)=>a+calcStars(id,k),0);
const avDiv=(photo,emoji,color,size=36)=>photo?`<div class="av" style="width:${size}px;height:${size}px;border:2px solid ${color||'var(--g)'}"><img src="${photo}"/></div>`:`<div class="av" style="width:${size}px;height:${size}px;background:${color||'#1D9E75'}22;border:2px solid ${color||'var(--g)'};font-size:${Math.round(size*0.45)}px">${emoji||'⭐'}</div>`;

// ── PAUSE / RESUME LISTENERS ─────────────────────────
let _listenersPaused=false;
let _pendingRefresh=false;

function pauseListeners(){
  _listenersPaused=true;
}

function resumeListeners(){
  _listenersPaused=false;
  if(_pendingRefresh){
    _pendingRefresh=false;
    if(document.getElementById('s-kid').classList.contains('active')) renderKid();
    if(document.getElementById('s-parent').classList.contains('active')){
      const at=document.querySelector('.tab.active');
      if(at) pTab(at.id.replace('t-',''));
    }
  }
}

// ── REAL-TIME LISTENERS ───────────────────────────────
function startPListener(uid){
  if(_unsubParent)_unsubParent();
  _unsubParent=onSnapshot(doc(db,'parents',uid),snap=>{
    if(!snap.exists())return;
    const d=snap.data();
    G.kids=d.kids||G.kids;G.tasks=d.tasks||G.tasks;G.rewards=d.rewards||G.rewards;
    G.religion=d.religion||G.religion;G.currency=d.currency||G.currency;G.prayOn=d.prayOn!==false;
    // Kid: check if current kid still exists — if not, kick to home
    if(G.kid){
      const stillExists=G.kids.find(k=>k.id===G.kid.id);
      if(!stillExists){
        stopListeners();clearSavedK();
        alert(G.kid.name+"'s account has been removed by the parent.");
        G.kid=null;SS('s-home');renderHome();return;
      }
      const updated=G.kids.find(k=>k.id===G.kid.id);
      if(updated)G.kid=updated;
    }
    // If paused (camera open) — mark pending refresh
    if(_listenersPaused){_pendingRefresh=true;return;}
    // Parent: refresh active tab
    if(document.getElementById('s-parent').classList.contains('active')){
      const at=document.querySelector('.tab.active');
      if(at)pTab(at.id.replace('t-',''));
    }
    // Kid: refresh (debounced)
    if(document.getElementById('s-kid').classList.contains('active')){
      schedKidRefresh();
    }
  },e=>console.error('pListener',e));
}

function startLogListener(uid,kidId){
  // Removed from kid screen - kids use direct state, no listeners
  // This prevents freezing on mobile phones
}

function startLogsListener(uid){
  if(_unsubLogs)_unsubLogs();
  _unsubLogs=onSnapshot(query(collection(db,'logs'),where('pUid','==',uid)),snap=>{
    snap.docChanges().forEach(ch=>{
      if(ch.type==='added'||ch.type==='modified'){
        const d=ch.doc.data();
        if(!G.logs[d.kidId])G.logs[d.kidId]={};
        G.logs[d.kidId][d.date]=d.log;
      }
    });
    rebuildPending();
    document.getElementById('adot').innerHTML=G.pending.length?'<span class="ndot"></span>':'';
    document.title=G.pending.length?'('+G.pending.length+') StarKids':'StarKids';
    // Don't refresh UI if paused
    if(_listenersPaused){_pendingRefresh=true;return;}
    if(document.getElementById('s-parent').classList.contains('active')){
      const at=document.querySelector('.tab.active');
      if(at&&at.id==='t-appr')pTab('appr');
    }
  },e=>console.error('logsListener',e));
}

function stopListeners(){
  if(_unsubParent){_unsubParent();_unsubParent=null;}
  if(_unsubLogs){_unsubLogs();_unsubLogs=null;}
  if(_unsubKidLog){_unsubKidLog();_unsubKidLog=null;}
}

function rebuildPending(){
  const np=[];
  Object.keys(G.logs).forEach(kidId=>{
    const kid=G.kids.find(k=>k.id===kidId);if(!kid)return;
    Object.keys(G.logs[kidId]).forEach(dk=>{
      const log=G.logs[kidId][dk];if(!log||!log.tasks)return;
      G.tasks.forEach(task=>{
        if(log.tasks[task.id]==='pending'){
          const ex=np.find(p=>p.kidId===kidId&&p.tid===task.id&&p.date===dk);
          if(!ex)np.push({kidId,kidName:kid.name,kidPhoto:kid.photo,kidEmoji:kid.emoji,kidColor:kid.color,task,tid:task.id,date:dk,time:'',photo:log.photos?log.photos[task.id]||null:null,ticked:log.ticked?!!log.ticked[task.id]:false});
        }
      });
    });
  });
  G.pending=np;
}

// Debounced kid refresh — prevents re-render while user is typing/tapping
let _kidRefTimer=null;
function schedKidRefresh(){
  if(_listenersPaused)return;
  clearTimeout(_kidRefTimer);
  _kidRefTimer=setTimeout(()=>{
    if(!_listenersPaused&&document.getElementById('s-kid').classList.contains('active'))renderKid();
  },3000); // 3 second debounce on mobile
}

// ── KID LOGIN ─────────────────────────────────────────
window.buildCI=()=>{const w=document.getElementById('ci');if(!w)return;w.innerHTML='';for(let i=0;i<6;i++){const inp=document.createElement('input');inp.type='text';inp.maxLength=1;inp.inputMode='numeric';inp.id='ci'+i;inp.oninput=e=>{const v=e.target.value.replace(/\D/,'');e.target.value=v;if(v&&i<5)document.getElementById('ci'+(i+1)).focus();};inp.onkeydown=e=>{if(e.key==='Backspace'&&!e.target.value&&i>0)document.getElementById('ci'+(i-1)).focus();};w.appendChild(inp);}};
const getCode=()=>{let c='';for(let i=0;i<6;i++)c+=(document.getElementById('ci'+i)||{}).value||'';return c;};
window.kidLogin=async()=>{const code=getCode();if(code.length<6){document.getElementById('cerr').textContent='Enter all 6 digits.';return;}document.getElementById('cerr').textContent='Looking up...';SS('s-loading');await doKidLogin(code);};
window.quickKLogin=async code=>{SS('s-loading');document.getElementById('load-msg').textContent='Loading tasks...';await doKidLogin(code);};
async function doKidLogin(code){
  try{
    const snap=await getDocs(collection(db,'parents'));
    let fKid=null,fPD=null;
    snap.forEach(ps=>{const d=ps.data();if(d.kids){const k=d.kids.find(k=>k.code===code);if(k){fKid=k;fPD={...d,uid:ps.id};}}});
    if(!fKid){SS('s-kidcode');buildCI();const el=document.getElementById('cerr');if(el)el.textContent='Code not found. Ask your parent.';return;}
    G.pUid=fPD.uid;G.pData={name:fPD.name};G.religion=fPD.religion||'islam';G.currency=fPD.currency||'SAR';G.prayOn=fPD.prayOn!==false;G.kids=fPD.kids||[];G.tasks=fPD.tasks||DEF_TASKS;G.rewards=fPD.rewards||DEF_REWARDS;
    G.kid=fKid;
    await loadLogs(fKid.id);
    const ws=wStars(fKid.id);
    saveKLocal(fKid,ws);
    // Update saved kids list with current data
    const allSaved=getSavedK();
    const updated=allSaved.filter(k=>G.kids.find(gk=>gk.code===k.code));
    try{localStorage.setItem(LS_K,JSON.stringify(updated));}catch{}

    const av=document.getElementById('k-av-top');if(av)av.innerHTML=avDiv(fKid.photo,fKid.emoji||'👦',fKid.color||'#1D9E75',36);
    document.getElementById('k-tit').textContent=fKid.name+"'s tasks";
    document.getElementById('k-sub').textContent=dn()+' · '+today()+' · 🟢 Live';
    // NO real-time listeners on kid screen - direct state only
    // This prevents freezing and camera issues on mobile
    SS('s-kid');renderKid();
    initPrayerTimes();
  }catch(e){SS('s-home');renderHome();alert('Error: '+e.message);}
}

  document.getElementById('k-stars').textContent='⭐ '+ws;
  const dow=new Date().getDay();const pr=prayers();

function buildTaskHtml(t,log){
  const status=log.tasks[t.id]||'none';
  const ticked=!!log.ticked[t.id];
  const photo=log.photos&&log.photos[t.id];
  let cls='tr';
  if(status==='approved')cls+=' done';
  else if(status==='pending')cls+=' pend';
  const sub=status==='approved'?`Approved ✓ · +${t.stars}⭐`:status==='pending'?'Waiting for parent approval':`+${t.stars}⭐`;

  let inner=`<div class="tname">${t.name}</div><div class="tsub">${sub}</div>`;

  // Show tick + photo buttons only when not approved
  if(status!=='approved'){
    inner+=`<div class="proof-area"><div class="proof-btns">`;
    // TICK BUTTON
    inner+=`<div class="proof-btn-tick${ticked?' ':' '}" onclick="tapTick('${t.id}')" style="${ticked?'background:var(--g);color:#fff;border-color:var(--g)':''}">${ticked?'✅ Ticked':'☐ Tick done'}</div>`;
    // PHOTO BUTTON — calls global camera
    inner+=`<div class="proof-btn-photo" onclick="tapPhoto('${t.id}')">${photo?'📷 Change photo':'📷 Take photo'}</div>`;
    inner+=`</div>`;
    if(photo)inner+=`<img class="proof-img" src="${photo}"/>`;
    inner+=`</div>`;
  } else {
    if(photo)inner+=`<img class="proof-img" src="${photo}" style="margin-top:6px"/>`;
  }

  const stIco=status==='approved'?'<div class="circ done">✓</div>':status==='pending'?'<div class="circ pend">⏳</div>':'';
  return `<div class="${cls}"><span class="tico">${t.ico}</span><div class="tinfo">${inner}</div>${stIco}</div>`;
}

// ── TASK INTERACTIONS ─────────────────────────────────
window.tapTick=function(id){
  const kid=G.kid;if(!kid)return;
  const lg=getLog(kid.id,today());
  if(lg.tasks[id]==='approved')return;
  lg.ticked[id]=!lg.ticked[id];
  if(lg.ticked[id]){
    if(lg.tasks[id]!=='pending'){
      lg.tasks[id]='pending';
      addPending(kid,id,lg);
    }
  } else {
    if(!lg.photos[id]){
      lg.tasks[id]='none';
      G.pending=G.pending.filter(p=>!(p.kidId===kid.id&&p.tid===id&&p.date===today()));
    }
  }
  renderKid(); // Immediate render - no Firebase wait
  saveLog(kid.id,today()); // Save after render - non-blocking
};

window.tapPhoto=function(id){
  const kid=G.kid;if(!kid)return;
  const lg=getLog(kid.id,today());
  if(lg.tasks[id]==='approved')return;
  openCamera(dataUrl=>{
    lg.photos[id]=dataUrl;
    if(lg.tasks[id]!=='pending'){
      lg.tasks[id]='pending';
      addPending(kid,id,lg);
    } else {
      const ex=G.pending.find(p=>p.kidId===kid.id&&p.tid===id&&p.date===today());
      if(ex)ex.photo=dataUrl;
    }
    renderKid(); // Render first - show photo immediately
    saveLog(kid.id,today()); // Save after - non-blocking
  });
};

function addPending(kid,tid,lg){
  const task=G.tasks.find(t=>t.id===tid);if(!task)return;
  const ex=G.pending.find(p=>p.kidId===kid.id&&p.tid===tid&&p.date===today());
  if(!ex){
    G.pending.push({kidId:kid.id,kidName:kid.name,kidPhoto:kid.photo,kidEmoji:kid.emoji,kidColor:kid.color,task,tid,date:today(),time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),photo:lg.photos[tid]||null,ticked:!!lg.ticked[tid]});
  }
}

window.tapPrayer=function(name){
  const kid=G.kid;if(!kid)return;
  const lg=getLog(kid.id,today());
  lg.prayers[name]=!lg.prayers[name];
  renderKid(); // Immediate
  saveLog(kid.id,today()); // Save after
};

// ── PRAYER TIMES ──────────────────────────────────────
function isNextPrayer(idx,pr,log){
  const now=new Date();const nowM=now.getHours()*60+now.getMinutes();
  for(let i=0;i<pr.length;i++){
    if(log.prayers[pr[i].n])continue;
    const t=G.prayerTimes[pr[i].n];
    if(t){const[h,m]=t.split(':').map(Number);if((h*60+m)>=nowM)return i===idx;}
    else return i===idx;
    break;
  }
  return false;
}
async function initPrayerTimes(){
  if(!G.prayOn||G.religion!=='islam')return;
  try{
    const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:6000}));
    const lat=pos.coords.latitude.toFixed(4);const lng=pos.coords.longitude.toFixed(4);
    const d=new Date();const ds=`${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}`;
    const r=await fetch(`https://api.aladhan.com/v1/timings/${ds}?latitude=${lat}&longitude=${lng}&method=4`);
    const data=await r.json();
    if(data.code===200){const t=data.data.timings;G.prayerTimes={Fajr:t.Fajr,Dhuhr:t.Dhuhr,Asr:t.Asr,Maghrib:t.Maghrib,Isha:t.Isha};G.prayerCity=data.data.meta.timezone?.split('/').pop().replace(/_/g,' ')||'';schedPrayerNotifs();renderKid();}
  }catch{
    try{const d=new Date();const ds=`${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}`;const r=await fetch(`https://api.aladhan.com/v1/timingsByCity/${ds}?city=Riyadh&country=SA&method=4`);const data=await r.json();if(data.code===200){const t=data.data.timings;G.prayerTimes={Fajr:t.Fajr,Dhuhr:t.Dhuhr,Asr:t.Asr,Maghrib:t.Maghrib,Isha:t.Isha};G.prayerCity='Riyadh';schedPrayerNotifs();renderKid();}}catch{}
  }
}

async function requestNotifPerm(){if(!('Notification'in window))return false;if(Notification.permission==='granted')return true;if(Notification.permission==='denied')return false;return(await Notification.requestPermission())==='granted';}
let _prayerTimers=[];
function schedPrayerNotifs(){
  _prayerTimers.forEach(t=>clearTimeout(t));_prayerTimers=[];
  if(Notification.permission!=='granted')return;
  const now=new Date();
  Object.entries(G.prayerTimes).forEach(([name,ts])=>{
    const[h,m]=ts.split(':').map(Number);const pt=new Date();pt.setHours(h,m,0,0);const diff=pt-now;
    if(diff>0&&diff<86400000){_prayerTimers.push(setTimeout(()=>{new Notification('🕌 '+name+' Prayer Time',{body:'Time for '+name+' prayer.',icon:'/starkids/icon-192.png',tag:'prayer-'+name});},diff));}
  });
  requestNotifPerm().then(ok=>{if(ok)schedPrayerNotifs();});
}
let _parentNotifTimer=null;
function schedParentNotif(){
  clearTimeout(_parentNotifTimer);
  const now=new Date();const t=new Date();t.setHours(20,30,0,0);if(t<=now)t.setDate(t.getDate()+1);
  _parentNotifTimer=setTimeout(()=>{
    if(Notification.permission==='granted'&&G.pending.length>0)new Notification('⭐ StarKids Daily Report',{body:`You have ${G.pending.length} pending approval${G.pending.length>1?'s':''}.`,icon:'/starkids/icon-192.png',tag:'daily'});
    schedParentNotif();
  },t-now);
}

        h+=`<div class="rcard${ok&&!r.given?' unlocked':r.given?' given':''}"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px"><div style="font-size:13px;font-weight:600">${r.given?'✅':r.claimed?'🎯':ok?'🏆':'🔒'} ${r.name}</div><div style="display:flex;gap:4px"><button class="btn ib" onclick="openRF(${ri})">✏️</button><button class="btn ib dan" onclick="delR(${ri})">🗑️</button></div></div><div class="pb" style="margin-bottom:4px"><div class="pbf" style="width:${pct}%"></div></div><div style="font-size:11px;color:var(--t3)">${r.given?'✅ Given':r.claimed?'🎯 '+r.claimedBy+' chose this':ok?'Unlocked!':c+'/'+r.stars} · ${r.period==='month'?'Monthly':'Weekly'}${r.type==='money'?' · 💰 '+G.currency+' '+r.amount:''}</div></div>`;
      });
    });
    pc.innerHTML=h;return;
  }
  if(tab==='report'){renderReport(pc);return;}
};

window.approveA=idx=>{const a=G.pending[idx];if(!a)return;const lg=getLog(a.kidId,a.date);lg.tasks[a.tid]='approved';saveLog(a.kidId,a.date);G.pending.splice(idx,1);pTab('appr');};
window.rejectA=idx=>{const a=G.pending[idx];if(!a)return;const lg=getLog(a.kidId,a.date);lg.tasks[a.tid]='none';if(lg.photos)delete lg.photos[a.tid];if(lg.ticked)delete lg.ticked[a.tid];saveLog(a.kidId,a.date);G.pending.splice(idx,1);pTab('appr');};
window.confirmR=ri=>{G.rewards[ri].given=true;G.rewards[ri].claimed=false;saveP();pTab('appr');alert('Reward given! ✅');};
window.declineR=ri=>{G.rewards[ri].claimed=false;delete G.rewards[ri].claimedBy;saveP();pTab('appr');};

// Tasks
let _nkEmoji='👦';
window.selNKEmoji=(el,e)=>{document.querySelectorAll('#nk-eg .emoji-opt').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');_nkEmoji=e;};
function pTRow(t){return `<div class="tr"><span class="tico">${t.ico}</span><div class="tinfo"><div class="tname">${t.name}</div><div class="tsub">+${t.stars}⭐ · ${t.cat}</div></div><div style="display:flex;gap:4px"><button class="btn ib" onclick="openTF('${t.id}')">✏️</button><button class="btn ib dan" onclick="delT('${t.id}')">🗑️</button></div></div>`;}
window.openTF=id=>{const t=id?G.tasks.find(x=>x.id===id):null;G.editTask=id||null;let h=`<div class="sl">${t?'Edit':'New'} task</div><div class="ff"><label>Icon</label><input id="tf-i" maxlength="4" value="${t?t.ico:''}" placeholder="📚"/></div><div class="ff"><label>Name</label><input id="tf-n" value="${t?t.name:''}" placeholder="e.g. Read 20 min"/></div><div class="ff"><label>Category</label><select id="tf-c"><option value="daily"${!t||t.cat==='daily'?' selected':''}>Daily</option><option value="bonus"${t&&t.cat==='bonus'?' selected':''}>Bonus</option></select></div><div class="ff"><label>Stars</label><select id="tf-s"><option value="1"${!t||t.stars==1?' selected':''}>1</option><option value="2"${t&&t.stars==2?' selected':''}>2</option><option value="3"${t&&t.stars==3?' selected':''}>3</option></select></div><div style="display:flex;gap:8px;margin-top:10px">${t?`<button class="btn dan" onclick="delT('${t.id}');pTab('tasks')">Delete</button>`:''}<button class="btn pri" onclick="saveT()">Save</button></div>`;document.getElementById('p-body').innerHTML=h;};
window.saveT=()=>{const i=document.getElementById('tf-i').value.trim()||'📌';const n=document.getElementById('tf-n').value.trim();if(!n){alert('Enter name.');return;}const c=document.getElementById('tf-c').value;const s=parseInt(document.getElementById('tf-s').value);if(G.editTask){const t=G.tasks.find(x=>x.id===G.editTask);if(t){t.ico=i;t.name=n;t.cat=c;t.stars=s;}}else G.tasks.push({id:uid(),ico:i,name:n,cat:c,stars:s});G.editTask=null;saveP();pTab('tasks');};
window.delT=id=>{if(!confirm('Delete task?'))return;G.tasks=G.tasks.filter(t=>t.id!==id);saveP();pTab('tasks');};
window.addKid=()=>{const n=document.getElementById('ki-n');if(!n||!n.value.trim())return;const cols=['#1D9E75','#7F77DD','#D85A30','#378ADD','#D4537E'];G.kids.push({id:'k'+Date.now(),name:n.value.trim(),color:cols[G.kids.length%cols.length],code:rndCode(),emoji:_nkEmoji,photo:null});n.value='';_nkEmoji='👦';saveP();pTab('kids');};
window.regenCode=id=>{const k=G.kids.find(x=>x.id===id);if(k){k.code=rndCode();saveP();pTab('kids');}};
window.removeKid=id=>{if(!confirm('Remove child? This cannot be undone.'))return;G.kids=G.kids.filter(k=>k.id!==id);saveP();pTab('kids');};
// Edit kid avatar
let _editKi=null;
window.editKidAv=ki=>{_editKi=ki;const k=G.kids[ki];let h=`<div style="text-align:center;margin-bottom:14px"><div style="font-size:15px;font-weight:600;margin-bottom:12px">Edit ${k.name}'s photo</div>`;h+=`<div style="width:80px;height:80px;border-radius:50%;overflow:hidden;border:3px solid ${k.color||'var(--g)'};margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:34px;background:${k.color||'#1D9E75'}22" id="kav-prev">${k.photo?`<img src="${k.photo}" style="width:100%;height:100%;object-fit:cover"/>`:k.emoji||'👦'}</div>`;h+=`<button class="btn pri sm" onclick="openCamera(d=>{const k=G.kids[_editKi];k.photo=d;k.emoji=null;const p=document.getElementById('kav-prev');if(p)p.innerHTML='<img src=\\''+d+'\\'style=\\'width:100%;height:100%;object-fit:cover\\'/>';})">📷 Upload photo</button></div>`;h+=`<div class="sl">Or choose emoji</div><div class="emoji-grid">${KEMOJIS.map(e=>`<div class="emoji-opt${(k.emoji||'👦')===e?' selected':''}" onclick="setKE(this,'${e}')">${e}</div>`).join('')}</div>`;h+=`<div style="display:flex;gap:8px;margin-top:12px"><button class="btn" onclick="pTab('kids')">Cancel</button><button class="btn pri" onclick="saveKidAv()">Save</button></div>`;document.getElementById('p-body').innerHTML=h;};
window.setKE=(el,e)=>{document.querySelectorAll('.emoji-grid .emoji-opt').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');const k=G.kids[_editKi];k.emoji=e;k.photo=null;const p=document.getElementById('kav-prev');if(p)p.innerHTML=e;};
window.saveKidAv=()=>{saveP();pTab('kids');};

// Rewards
window.openRF=idx=>{G.editReward=idx;const r=idx!=null?G.rewards[idx]:null;document.getElementById('re-tit').textContent=r?'Edit reward':'Add reward';let h=`<div class="ff"><label>Name</label><input id="rf-n" value="${r?r.name:''}" placeholder="e.g. Pizza night"/></div><div class="ff"><label>Stars required</label><input id="rf-s" type="number" min="1" value="${r?r.stars:30}"/></div><div class="ff"><label>Period</label><div class="seg" id="rf-per"><div class="segb${!r||r.period==='week'?' active':''}" onclick="setSeg('rf-per',0)">📅 Weekly</div><div class="segb${r&&r.period==='month'?' active':''}" onclick="setSeg('rf-per',1)">📆 Monthly</div></div></div><div class="ff"><label>Type</label><div class="seg" id="rf-type"><div class="segb${!r||r.type==='treat'?' active':''}" onclick="setSeg('rf-type',0);document.getElementById('rf-m').style.display='none'">🎉 Treat</div><div class="segb${r&&r.type==='money'?' active':''}" onclick="setSeg('rf-type',1);document.getElementById('rf-m').style.display='block'">💰 Cash</div></div></div><div id="rf-m" style="display:${r&&r.type==='money'?'block':'none'}"><div class="ff"><label>Amount (${G.currency})</label><input id="rf-a" type="number" value="${r&&r.amount?r.amount:''}"/></div><div class="ff"><label>Payment</label><select id="rf-py"><option value="cash">Cash</option><option value="transfer"${r&&r.payType==='transfer'?' selected':''}>Bank transfer</option><option value="wallet"${r&&r.payType==='wallet'?' selected':''}>STC Pay</option></select></div></div><div style="display:flex;gap:8px;margin-top:12px">${idx!=null?`<button class="btn dan" onclick="delR(${idx});pTab('rewards');SS('s-parent')">Delete</button>`:''}<button class="btn pri" onclick="saveR()">Save</button></div>`;document.getElementById('re-body').innerHTML=h;SS('s-redit');};
window.setSeg=(id,ai)=>document.querySelectorAll(`#${id} .segb`).forEach((b,i)=>b.classList.toggle('active',i===ai));
window.saveR=()=>{const n=document.getElementById('rf-n').value.trim();if(!n){alert('Enter name.');return;}const s=parseInt(document.getElementById('rf-s').value)||20;const period=document.querySelectorAll('#rf-per .segb')[1].classList.contains('active')?'month':'week';const type=document.querySelectorAll('#rf-type .segb')[1].classList.contains('active')?'money':'treat';const amount=type==='money'?parseFloat(document.getElementById('rf-a').value)||0:null;const payType=type==='money'?document.getElementById('rf-py').value:null;const obj={id:uid(),name:n,stars:s,period,type,amount,payType,given:false};if(G.editReward!=null)G.rewards[G.editReward]=obj;else G.rewards.push(obj);G.editReward=null;saveP();pTab('rewards');SS('s-parent');};

// ── REPORT ────────────────────────────────────────────
function renderReport(pc){let h=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px" id="rk-sel">`;G.kids.forEach((k,i)=>{h+=`<div class="badge ${i===0?'pro':'free'}" style="cursor:pointer;padding:5px 12px" onclick="selRK('${k.id}')">${k.emoji||'👦'} ${k.name}</div>`;});h+=`</div><div id="rb"></div>`;pc.innerHTML=h;if(G.kids.length)selRK(G.kids[0].id);}
window.selRK=id=>{G.repKid=id;document.querySelectorAll('#rk-sel .badge').forEach(b=>b.className='badge free');const k=G.kids.find(x=>x.id===id);const ab=Array.from(document.querySelectorAll('#rk-sel .badge')).find(b=>b.textContent.includes(k?.name||''));if(ab)ab.className='badge pro';const rb=document.getElementById('rb');if(!rb)return;rb.innerHTML=`<div class="seg" id="rp-seg"><div class="segb active" onclick="setRP('week')">📅 Weekly</div><div class="segb" onclick="setRP('month')">📆 Monthly</div></div><div id="rc"></div>`;setRP('week');};
window.setRP=p=>{document.querySelectorAll('#rp-seg .segb').forEach((b,i)=>b.classList.toggle('active',(p==='week'&&i===0)||(p==='month'&&i===1)));genRep(G.repKid,p);};
function genRep(kidId,period){
  const kid=G.kids.find(k=>k.id===kidId);if(!kid)return;
  const keys=period==='week'?wkeys():mkeys();const pr=prayers();const td=today();
  let ts=0,pd=0,td2=0,tt=0,bd=0;
  keys.forEach(dk=>{ts+=calcStars(kidId,dk);const log=getLog(kidId,dk);let ap=pr.length>0;pr.forEach(p=>{if(!log.prayers[p.n])ap=false;});if(ap&&pr.length)pd++;G.tasks.filter(t=>t.cat==='daily').forEach(t=>{tt++;if(log.tasks[t.id]==='approved')td2++;});G.tasks.filter(t=>t.cat==='bonus').forEach(t=>{if(log.tasks[t.id]==='approved')bd++;});});
  const tp=tt?Math.round(td2/tt*100):0;const pp=pr.length?Math.round(pd/keys.length*100):null;
  const now=new Date();const dl=period==='week'?`${wkeys()[0]} → ${wkeys()[6]}`:`${now.toLocaleString('default',{month:'long'})} ${now.getFullYear()}`;
  const grade=tp>=90?'🥇 Excellent':tp>=70?'🥈 Very good':tp>=50?'🥉 Good':'💪 Keep going';
  const msg=tp>=90?`Outstanding ${period} from ${kid.name}!`:tp>=70?`Great effort!`:tp>=50?`Progress — aim for more!`:`Let's encourage ${kid.name} more.`;
  let h=`<div class="rphdr"><div style="font-size:17px;font-weight:700">⭐ ${kid.name}'s Report</div><div style="font-size:12px;opacity:.85;margin-top:3px">${period==='week'?'Weekly':'Monthly'} · ${dl}</div></div>`;
  h+=`<div class="sgrid"><div class="scard"><div class="sgnum">${ts}</div><div class="sglbl">⭐ Stars</div></div><div class="scard"><div class="sgnum">${tp}%</div><div class="sglbl">📋 Tasks</div></div>`;
  if(pp!==null)h+=`<div class="scard"><div class="sgnum">${pp}%</div><div class="sglbl">🙏 Prayers</div></div>`;
  h+=`<div class="scard"><div class="sgnum">${bd}</div><div class="sglbl">⭐ Bonus</div></div></div>`;
  [{l:'Daily tasks',v:tp,max:100,u:'%'},{l:'Stars earned',v:ts,max:Math.max(ts,50),u:'⭐'}].forEach(b=>{const pct=b.max?Math.min(100,Math.round(b.v/b.max*100)):0;h+=`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--t2);margin-bottom:3px;font-weight:500"><span>${b.l}</span><span>${b.v}${b.u}</span></div><div class="pb"><div class="pbf" style="width:${pct}%"></div></div></div>`;});
  h+=`<div class="sl">Day by day</div><div class="dgrid">`;(period==='week'?keys:wkeys()).forEach((dk,i)=>{const s=calcStars(kidId,dk);h+=`<div class="dcell${dk===td?' today':''}"><div style="font-size:9px;color:var(--t3);font-weight:600">${DS[i]}</div><div style="font-size:13px;font-weight:700;color:var(--g)">${s}</div></div>`;});
  h+=`</div><div class="info g" style="text-align:center"><div style="font-size:20px;margin-bottom:4px">${grade}</div><div style="font-size:13px">${msg}</div></div>`;
  document.getElementById('rc').innerHTML=h;
}

window.renderSettings=()=>{
  const PE=['👨‍👩‍👧','👩‍👧','👨‍👧','👩','👨','👩‍💼','👨‍💼','🧑‍💼'];
  let h=`<div class="sl">Your profile</div><div class="card" style="text-align:center">`;

  h+=`<div class="emoji-grid">${PE.map(e=>`<div class="emoji-opt${(G.pEmoji||'👨‍👩‍👧')===e?' selected':''}" onclick="G.pEmoji=this.textContent;G.pPhoto=null;saveP();renderSettings();const av=document.getElementById('p-av-top');if(av)av.innerHTML=avDiv(null,G.pEmoji,'#1D9E75',36);">${e}</div>`).join('')}</div>`;
  h+=`<button class="btn dan" style="width:100%;margin-top:10px" onclick="doSignOut()">Sign out</button></div>`;
  h+=`<div class="sl">Prayer module</div><div class="card"><div class="togrow"><div><div style="font-size:13px;font-weight:600">Enable prayer section</div></div><button class="tog ${G.prayOn?'on':'off'}" onclick="G.prayOn=!G.prayOn;saveP();renderSettings()"></button></div>`;
  if(G.prayOn)h+=`<div style="margin-top:10px"><div class="ff" style="margin:0"><label>Religion</label><select id="s-rel" onchange="G.religion=this.value;saveP()"><option value="islam"${G.religion==='islam'?' selected':''}>Islam — 5 prayers</option><option value="christian"${G.religion==='christian'?' selected':''}>Christian — 3 times</option><option value="other"${G.religion==='other'?' selected':''}>Other</option></select></div></div>`;
  h+=`</div><div class="sl">Currency</div><div class="card"><div class="ff" style="margin:0"><select onchange="G.currency=this.value;saveP()"><option value="SAR"${G.currency==='SAR'?' selected':''}>SAR</option><option value="USD"${G.currency==='USD'?' selected':''}>USD</option><option value="GBP"${G.currency==='GBP'?' selected':''}>GBP</option><option value="AED"${G.currency==='AED'?' selected':''}>AED</option></select></div></div>`;
  h+=`<div class="sl">Saved logins</div><div class="card"><button class="btn dan sm" onclick="localStorage.clear();alert('Cleared.');renderSettings()">Clear all saved logins</button></div>`;
  document.getElementById('set-body').innerHTML=h;
};

// ── MANUAL REFRESH FOR KID ────────────────────────────
async function refreshKidFromServer(){
  const kid=G.kid;if(!kid||!G.pUid)return;
  // Show brief loading indicator
  const btn=document.querySelector('[onclick="refreshKidFromServer()"]');
  if(btn){btn.textContent='⏳ Checking...';btn.disabled=true;}
  try{
    // Reload parent data (tasks, rewards)
    const snap=await getDoc(doc(db,'parents',G.pUid));
    if(snap.exists()){
      const d=snap.data();
      G.kids=d.kids||G.kids;G.tasks=d.tasks||G.tasks;G.rewards=d.rewards||G.rewards;
      // Check kid still exists
      if(!G.kids.find(k=>k.id===kid.id)){
        stopListeners();clearSavedK();
        alert(kid.name+"'s account has been removed.");
        G.kid=null;SS('s-home');renderHome();return;
      }
    }
    // Reload today's log
    await loadLogs(kid.id);
  }catch(e){console.error('refresh',e);}
  renderKid();
}
