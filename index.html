<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1D9E75">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<base href="/starkids/">
<link rel="manifest" href="manifest.json">
<title>StarKids</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--g:#1D9E75;--gd:#0F6E56;--gl:#E1F5EE;--gb:#5DCAA5;--p:#534AB7;--pl:#EEEDFE;--pb:#AFA9EC;--a:#BA7517;--al:#FAEEDA;--ab:#FAC775;--r:#E24B4A;--rl:#FCEBEB;--t:#1a1a1a;--t2:#555;--t3:#999;--bg:#fff;--bg2:#f7f7f5;--bg3:#f0eeea;--bd:rgba(0,0,0,0.11);--bd2:rgba(0,0,0,0.2);--rad:10px;--radl:14px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--t)}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
.screen{display:none;flex-direction:column;min-height:100vh}
.screen.active{display:flex}
.topbar{padding:13px 15px 11px;background:var(--bg);border-bottom:0.5px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;z-index:10}
.tb-t{font-size:15px;font-weight:600;color:var(--t)}
.tb-s{font-size:11px;color:var(--t3);margin-top:1px}
.content{flex:1;overflow-y:auto;padding:12px 14px;-webkit-overflow-scrolling:touch}
.bbar{padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:0.5px solid var(--bd);display:flex;gap:8px;flex-shrink:0;background:var(--bg)}
.btn{padding:9px 14px;border-radius:var(--rad);border:0.5px solid var(--bd2);background:var(--bg);color:var(--t);font-size:13px;cursor:pointer;flex:1;text-align:center;font-weight:500}
.btn:active{opacity:.75}
.btn.pri{background:var(--g);border-color:var(--g);color:#fff}
.btn.dan{background:var(--r);border-color:var(--r);color:#fff}
.btn.warn{background:var(--a);border-color:var(--a);color:#fff}
.btn.sm{flex:none;padding:5px 11px;font-size:12px}
.btn.ib{flex:none;width:28px;height:28px;padding:0;display:flex;align-items:center;justify-content:center;font-size:14px}
.tabs{display:flex;border-bottom:0.5px solid var(--bd);flex-shrink:0;overflow-x:auto;background:var(--bg)}
.tab{flex:1;min-width:56px;padding:9px 4px;text-align:center;font-size:11px;font-weight:500;cursor:pointer;color:var(--t3);border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--g);border-bottom-color:var(--g)}
.card{border:0.5px solid var(--bd);border-radius:var(--radl);padding:12px 14px;margin-bottom:8px;background:var(--bg)}
.sl{font-size:11px;font-weight:600;color:var(--t3);letter-spacing:.05em;text-transform:uppercase;margin:14px 0 7px}
.sl:first-child{margin-top:2px}
/* Task rows */
.tr{display:flex;align-items:flex-start;gap:9px;padding:10px 12px;border:0.5px solid var(--bd);border-radius:var(--rad);margin-bottom:6px;background:var(--bg)}
.tr.done{background:var(--gl);border-color:var(--gb)}
.tr.pend{background:var(--al);border-color:var(--ab)}
.tr.rejected{background:var(--rl);border-color:var(--r)}
.tico{font-size:17px;width:24px;text-align:center;flex-shrink:0;padding-top:2px}
.tinfo{flex:1;min-width:0}
.tname{font-size:13px;font-weight:600;color:var(--t);margin-bottom:2px}
.tsub{font-size:11px;color:var(--t3)}
.tsub.red{color:var(--r);font-weight:500}
.circ{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--bd2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:600}
.circ.done{background:var(--g);border-color:var(--g);color:#fff}
.circ.pend{background:var(--ab);border-color:var(--ab);font-size:11px}
.circ.rejected{background:var(--r);border-color:var(--r);color:#fff;font-size:11px}
/* Prayer */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:6px}
.pcard{border:0.5px solid var(--bd);border-radius:var(--rad);padding:9px 12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;background:var(--bg)}
.pcard.done{background:var(--gl);border-color:var(--gb)}
.pcard.next{border-color:var(--g);border-width:2px}
/* Stars bar */
.sbar{background:var(--bg2);border-radius:var(--rad);padding:11px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border:0.5px solid var(--bd)}
.snum{font-size:22px;font-weight:700;color:var(--g)}
.slbl{font-size:10px;color:var(--t3);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
/* Login */
.lwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;background:var(--bg)}
.lopt{width:100%;padding:13px 15px;border:0.5px solid var(--bd);border-radius:var(--radl);cursor:pointer;display:flex;align-items:center;gap:13px;margin-bottom:9px;background:var(--bg)}
.lopt:active{background:var(--bg2)}
/* Code input */
.cw{display:flex;gap:7px;justify-content:center;margin:14px 0}
.cw input{width:42px;height:50px;text-align:center;font-size:22px;font-weight:700;border:1.5px solid var(--bd2);border-radius:var(--rad);padding:0;background:var(--bg);color:var(--t)}
.cw input:focus{border-color:var(--g);outline:none}
.codebox{background:var(--bg2);border-radius:var(--rad);padding:13px;text-align:center;margin:10px 0;border:0.5px solid var(--bd)}
.codedigits{font-size:26px;font-weight:700;letter-spacing:9px;color:var(--g);font-family:monospace}
/* Misc */
.badge{display:inline-block;padding:2px 7px;border-radius:7px;font-size:11px;font-weight:600}
.badge.pend{background:var(--al);color:#633806}
.badge.ok{background:var(--gl);color:#085041}
.badge.rej{background:var(--rl);color:#791F1F}
.badge.pro{background:var(--pl);color:#26215C}
.badge.free{background:var(--bg2);color:var(--t2)}
.ndot{width:7px;height:7px;background:var(--r);border-radius:50%;display:inline-block;margin-left:3px;vertical-align:middle}
.info{border-radius:var(--rad);padding:10px 13px;font-size:12px;margin-bottom:10px;line-height:1.6}
.info.g{background:var(--gl);border:0.5px solid var(--gb);color:#085041}
.info.a{background:var(--al);border:0.5px solid var(--ab);color:#633806}
.info.p{background:var(--pl);border:0.5px solid var(--pb);color:#26215C}
.info.r{background:var(--rl);border:0.5px solid var(--r);color:#791F1F}
.rcard{border:0.5px solid var(--bd);border-radius:var(--rad);padding:12px 13px;margin-bottom:7px;background:var(--bg)}
.rcard.unlocked{background:var(--gl);border-color:var(--gb)}
.rcard.given{background:var(--bg2);opacity:.7}
.rcard.selectable{border:2px solid var(--g);cursor:pointer}
.pb{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden}
.pbf{height:100%;border-radius:3px;background:var(--g)}
.seg{display:flex;border:0.5px solid var(--bd2);border-radius:var(--rad);overflow:hidden;margin-bottom:10px}
.segb{flex:1;padding:7px;font-size:12px;font-weight:500;cursor:pointer;text-align:center;background:var(--bg);color:var(--t3);border:none}
.segb.active{background:var(--g);color:#fff}
.ff{margin-bottom:11px}
.ff label{font-size:12px;color:var(--t2);display:block;margin-bottom:3px;font-weight:600}
.ff input,.ff select{width:100%;padding:8px 10px;border:0.5px solid var(--bd2);border-radius:var(--rad);font-size:13px;background:var(--bg);color:var(--t)}
.inp{width:100%;padding:10px 12px;border:0.5px solid var(--bd2);border-radius:var(--rad);font-size:14px;background:var(--bg);color:var(--t);margin-bottom:10px}
.inp:focus{border-color:var(--g);outline:none}
.rphdr{background:var(--g);border-radius:var(--radl);padding:16px;color:#fff;text-align:center;margin-bottom:12px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.scard{border:0.5px solid var(--bd);border-radius:var(--rad);padding:11px;text-align:center;background:var(--bg)}
.sgnum{font-size:24px;font-weight:700;color:var(--g)}
.sglbl{font-size:10px;color:var(--t3);margin-top:2px;font-weight:600;text-transform:uppercase}
.dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.dcell{text-align:center;padding:5px 2px;border-radius:var(--rad);border:0.5px solid var(--bd)}
.dcell.today{border-color:var(--g);background:var(--gl)}
.unlock-banner{background:var(--g);color:#fff;border-radius:var(--rad);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:12px;color:var(--t3);font-size:14px}
.spinner{width:32px;height:32px;border:3px solid var(--bd);border-top-color:var(--g);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.togrow{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:0.5px solid var(--bd)}
.togrow:last-child{border:none}
.tog{width:38px;height:21px;border-radius:11px;border:none;cursor:pointer;position:relative;flex-shrink:0}
.tog.on{background:var(--g)}.tog.off{background:#ccc}
.tog::after{content:'';position:absolute;width:15px;height:15px;border-radius:50%;background:#fff;top:3px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog.on::after{left:20px}.tog.off::after{left:3px}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.saved-card{width:100%;padding:13px 15px;border:0.5px solid var(--bd);border-radius:var(--radl);cursor:pointer;display:flex;align-items:center;gap:13px;margin-bottom:9px;background:var(--bg)}
.saved-card:active{background:var(--gl)}
.kid-picker{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.kid-pick-card{border:0.5px solid var(--bd);border-radius:var(--radl);padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;background:var(--bg);text-align:center}
.kid-pick-card:active{background:var(--gl);border-color:var(--gb)}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:8px 0}
.emoji-opt{font-size:22px;text-align:center;padding:6px;border-radius:var(--rad);cursor:pointer;border:0.5px solid transparent}
.emoji-opt.selected{border-color:var(--g);background:var(--gl)}
.check-row{display:flex;align-items:center;gap:8px;margin:10px 0;cursor:pointer;font-size:13px;color:var(--t2)}
.check-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--g)}
/* Proof area */
.proof-area{margin-top:7px}
.proof-btns{display:flex;gap:7px}
.pbtn{flex:1;padding:9px 6px;border-radius:var(--rad);font-size:12px;font-weight:600;cursor:pointer;text-align:center;border:none}
.pbtn.tick{background:var(--gl);color:#085041}
.pbtn.tick.active{background:var(--g);color:#fff}
.pbtn.photo{background:var(--pl);color:#26215C}
.pbtn.photo.active{background:var(--p);color:#fff}
.proof-img{width:100%;max-height:100px;object-fit:cover;border-radius:var(--rad);margin-top:7px;display:block;border:0.5px solid var(--bd)}
.resubmit-btn{width:100%;margin-top:7px;padding:8px;border-radius:var(--rad);background:var(--r);color:#fff;border:none;font-size:12px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="app">
<!-- HOME -->
<div class="screen active" id="s-home">
  <div class="lwrap">
    <div style="font-size:46px;margin-bottom:8px">⭐</div>
    <div style="font-size:22px;font-weight:700;margin-bottom:3px">StarKids</div>
    <div style="font-size:13px;color:var(--t3);margin-bottom:22px;text-align:center">Discipline · Habits · Rewards</div>
    <div style="width:100%" id="home-content"></div>
    <div style="margin-top:16px;font-size:11px;color:var(--t3)">StarKids v8.0</div>
  </div>
</div>
<!-- PARENT AUTH -->
<div class="screen" id="s-auth">
  <div class="topbar"><div class="tb-t">Parent account</div><button class="btn sm" onclick="SS('s-home');renderHome()">Back</button></div>
  <div class="content"><div class="seg" id="auth-seg"><div class="segb active" onclick="setAM('in')">Sign in</div><div class="segb" onclick="setAM('up')">Create account</div></div><div id="auth-form"></div></div>
</div>
<!-- KID CODE -->
<div class="screen" id="s-code">
  <div class="topbar"><div class="tb-t">I am a kid 👦</div><button class="btn sm" onclick="SS('s-home');renderHome()">Back</button></div>
  <div class="content" style="display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center">
    <div style="font-size:44px;margin-bottom:12px">🔑</div>
    <div style="font-size:17px;font-weight:600;margin-bottom:4px">Enter your secret code</div>
    <div style="font-size:13px;color:var(--t3);margin-bottom:2px">Ask your parent for your 6-digit code</div>
    <div class="cw" id="ci"></div>
    <div id="cerr" style="font-size:12px;color:var(--r);min-height:16px;margin-bottom:10px"></div>
    <button class="btn pri" style="width:100%;max-width:260px;padding:12px" onclick="kidLogin()">🚀 Continue</button>
  </div>
</div>
<!-- LOADING -->
<div class="screen" id="s-load"><div class="loading"><div class="spinner"></div><div id="load-msg">Loading...</div></div></div>
<!-- PARENT MAIN -->
<div class="screen" id="s-parent">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px"><div id="p-av-top" onclick="SS('s-settings');renderSettings()" style="cursor:pointer"></div><div><div class="tb-t" id="p-tit">Dashboard</div><div class="tb-s" id="p-sub"></div></div></div>
    <div style="display:flex;gap:5px"><button class="btn sm" onclick="SS('s-settings');renderSettings()">⚙️</button><button class="btn sm" onclick="doSignOut()">Exit</button></div>
  </div>
  <div class="tabs">
    <div class="tab active" id="t-appr" onclick="pTab('appr')">Approvals<span id="adot"></span></div>
    <div class="tab" id="t-tasks" onclick="pTab('tasks')">Tasks</div>
    <div class="tab" id="t-kids" onclick="pTab('kids')">Kids</div>
    <div class="tab" id="t-rewards" onclick="pTab('rewards')">Rewards</div>
    <div class="tab" id="t-report" onclick="pTab('report')">Report</div>
  </div>
  <div class="content" id="p-body"></div>
</div>
<!-- KID MAIN -->
<div class="screen" id="s-kid">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px"><div id="k-av-top" onclick="showKidProfile()" style="cursor:pointer"></div><div><div class="tb-t" id="k-tit">My tasks</div><div class="tb-s" id="k-sub"></div></div></div>
    <div style="display:flex;gap:5px"><span id="k-stars" style="font-size:13px;font-weight:700;color:var(--g)"></span><button class="btn sm" onclick="SS('s-home');renderHome()">Exit</button></div>
  </div>
  <div class="content" id="k-body"></div>
  <div class="bbar"><button class="btn" onclick="showKidRewards()">🏆 Rewards</button><button class="btn pri" onclick="submitDay()">Submit day</button></div>
</div>
<!-- KID PROFILE (change DP) -->
<div class="screen" id="s-kprofile">
  <div class="topbar"><div class="tb-t">My Profile</div><button class="btn sm" onclick="SS('s-kid');renderKid()">Back</button></div>
  <div class="content" id="kprofile-body"></div>
</div>
<!-- KID REWARDS -->
<div class="screen" id="s-choose"><div class="topbar"><div class="tb-t">Choose reward 🎉</div><button class="btn sm" onclick="SS('s-kid');renderKid()">Back</button></div><div class="content" id="choose-body"></div></div>
<div class="screen" id="s-krewards"><div class="topbar"><div class="tb-t">My Rewards</div><button class="btn sm" onclick="SS('s-kid');renderKid()">Back</button></div><div class="content" id="kr-body"></div></div>
<!-- SETTINGS -->
<div class="screen" id="s-settings"><div class="topbar"><div class="tb-t">Settings</div><button class="btn sm" onclick="SS('s-parent')">Back</button></div><div class="content" id="set-body"></div></div>
<!-- REWARD EDIT -->
<div class="screen" id="s-redit"><div class="topbar"><div class="tb-t" id="re-tit">Add reward</div><button class="btn sm" onclick="pTab('rewards');SS('s-parent')">Cancel</button></div><div class="content" id="re-body"></div></div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut,updateProfile,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import{getFirestore,doc,setDoc,getDoc,collection,query,where,getDocs,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
// Firebase Storage not used (requires paid plan)

const FC={apiKey:"AIzaSyBRFMAu5DxyT_ORclTOWjXwkbM1EIuXVcc",authDomain:"starkids-773c3.firebaseapp.com",projectId:"starkids-773c3",storageBucket:"starkids-773c3.firebasestorage.app",messagingSenderId:"356520993318",appId:"1:356520993318:web:475977e92d5a5dbb5d3ce7"};
const fbApp=initializeApp(FC);
const auth=getAuth(fbApp);
const db=getFirestore(fbApp);
// const storage = not needed

// ── CONSTANTS ─────────────────────────────────────────
const PI=[{n:'Fajr',t:'Dawn'},{n:'Dhuhr',t:'Midday'},{n:'Asr',t:'Afternoon'},{n:'Maghrib',t:'Sunset'},{n:'Isha',t:'Night'}];
const PC=[{n:'Morning prayer',t:'Start'},{n:'Midday prayer',t:'Noon'},{n:'Evening prayer',t:'End'}];
const SHD=[0,3];
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DS=['S','M','T','W','T','F','S'];
const KEMOJIS=['👦','👧','🧒','👶','🦁','🐯','🦊','🐻','🐼','🦄','🐸','🐧','🦋','⭐','🚀','⚽','🎮','🎨','🎵','🌟','🏆','💪','🧠','🌈'];
const DEF_TASKS=[
  {id:'t1',ico:'🛏',name:'Make bed',cat:'daily',stars:1},

  {id:'t3',ico:'🪥',name:'Brush teeth (night)',cat:'daily',stars:1},

const DEF_REWARDS=[
  {id:'r1',name:'Ice cream',stars:20,period:'week',type:'treat',amount:null,payType:null,given:false},
  {id:'r2',name:'Family movie',stars:35,period:'week',type:'treat',amount:null,payType:null,given:false},

];

// ── STATE ─────────────────────────────────────────────
let G={pUid:null,pData:null,kids:[],tasks:DEF_TASKS,rewards:DEF_REWARDS,logs:{},pending:[],kid:null,religion:'islam',currency:'SAR',prayOn:true,editTask:null,editReward:null,repKid:null,pEmoji:'👨‍👩‍👧',pPhoto:null,apprTab:null};

const LS_P='sk_p8',LS_K='sk_k8';

// ── UTILS ─────────────────────────────────────────────
window.SS=id=>{document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id)?.classList.add('active');window.scrollTo(0,0);};
const uid=()=>'x'+Date.now()+Math.floor(Math.random()*999);

const dn=()=>DAYS[new Date().getDay()];

// Single approach: create input fresh each time (most reliable on Android)
function openCamera(callback){
  // Request permission first on mobile
  const inp=document.createElement('input');
  inp.type='file';
  inp.accept='image/*';
  inp.capture='environment';
  inp.style.cssText='position:fixed;left:-9999px;top:-9999px;opacity:0;width:1px;height:1px';
  document.body.appendChild(inp);
  inp.addEventListener('change',e=>{
    const file=e.target.files[0];
    document.body.removeChild(inp);
    if(!file){return;}
    // Compress image before storing
    const reader=new FileReader();
    reader.onload=ev=>{
      compressImage(ev.target.result,800,quality=>{
        callback(quality);
      });
    };
    reader.readAsDataURL(file);
  });
  // Small delay ensures DOM is ready on mobile
  setTimeout(()=>inp.click(),100);
}

function compressImage(dataUrl,maxWidth,callback){
  try{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      let w=img.width,h=img.height;
      if(w>maxWidth){h=Math.round(h*maxWidth/w);w=maxWidth;}
      canvas.width=w;canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      callback(canvas.toDataURL('image/jpeg',0.6));
    };
    img.onerror=()=>callback(dataUrl);
    img.src=dataUrl;
  }catch{callback(dataUrl);}
}

function startKidPL(uid){

  if(_unsubKP)_unsubKP();

    if(!snap.exists())return;
    const d=snap.data();
    G.tasks=d.tasks||G.tasks;G.rewards=d.rewards||G.rewards;

    if(G.kid&&!d.kids.find(k=>k.id===G.kid.id)){

      alert(G.kid.name+"'s account has been removed by the parent.");

function startLogsL(uid){
  if(_unsubLogs)_unsubLogs();
  _unsubLogs=onSnapshot(query(collection(db,'logs'),where('pUid','==',uid)),snap=>{
    snap.docChanges().forEach(ch=>{
      if(ch.type==='added'||ch.type==='modified'){
        const d=ch.doc.data();
        if(!G.logs[d.kidId])G.logs[d.kidId]={};
        if(d.log){G.logs[d.kidId][d.date]=d.log;if(!G.logs[d.kidId][d.date].photos)G.logs[d.kidId][d.date].photos={};}
      }
    });
    rebuildP();
    document.getElementById('adot').innerHTML=G.pending.length?'<span class="ndot"></span>':'';
    document.title=G.pending.length?`(${G.pending.length}) StarKids`:'StarKids';
    if(document.getElementById('s-parent').classList.contains('active')){const at=document.querySelector('.tab.active');if(at&&at.id==='t-appr')pTab('appr');}
  },e=>console.error('LL',e));
}
function stopL(){if(_unsubP){_unsubP();_unsubP=null;}if(_unsubLogs){_unsubLogs();_unsubLogs=null;}if(_unsubKP){_unsubKP();_unsubKP=null;}}
function rebuildP(){
  const np=[];
  Object.keys(G.logs).forEach(kidId=>{
    const kid=G.kids.find(k=>k.id===kidId);if(!kid)return;
    Object.keys(G.logs[kidId]).forEach(dk=>{
      const log=G.logs[kidId][dk];if(!log||!log.tasks)return;
      G.tasks.forEach(task=>{
        if(log.tasks[task.id]==='pending'){
          const ex=np.find(p=>p.kidId===kidId&&p.tid===task.id&&p.date===dk);
          if(!ex)np.push({
            kidId,kidName:kid.name,kidPhoto:kid.photo,kidEmoji:kid.emoji,kidColor:kid.color,
            task,tid:task.id,date:dk,time:'',
            photo:log.photos?log.photos[task.id]||null:null,
            ticked:log.ticked?!!log.ticked[task.id]:false
          });
        }
      });

function renderKid(){
  const kid=G.kid;if(!kid)return;
  const dk=today();const log=getLog(kid.id,dk);
  const ts=calcStars(kid.id,dk);const ws=wStars(kid.id);
  document.getElementById('k-stars').textContent='⭐ '+ws;
  const dow=new Date().getDay();const pr=prayers();
  const claimable=G.rewards.filter(r=>{const c=r.period==='month'?mStars(kid.id):ws;return c>=r.stars&&!r.given&&!r.claimed;});
  // Issue 5: count rejected tasks
  const rejected=G.tasks.filter(t=>log.tasks[t.id]==='rejected');
  let h='';
  if(claimable.length)h+=`<div class="unlock-banner"><div><div style="font-size:13px;font-weight:600">🏆 ${claimable.length} reward${claimable.length>1?'s':''} ready!</div><div style="font-size:11px;opacity:.85">Tap to choose</div></div><button class="btn sm" style="background:#fff;color:var(--g);border-color:#fff;flex:none" onclick="showRewardChooser()">Choose ✨</button></div>`;
  if(rejected.length)h+=`<div class="info r">❌ ${rejected.length} task${rejected.length>1?'s':''} rejected by parent. See below in red — tap to resubmit.</div>`;
  h+=`<div class="sbar"><div><div class="slbl">Today</div><div class="snum">${ts} ⭐</div></div><div style="text-align:right"><div class="slbl">This week</div><div style="font-size:18px;font-weight:700;color:var(--t)">${ws} ⭐</div></div></div>`;
  // Refresh button
  h+=`<div style="text-align:right;margin-bottom:8px"><button onclick="refreshKid()" style="background:none;border:0.5px solid var(--bd);border-radius:20px;padding:4px 12px;font-size:11px;color:var(--t3);cursor:pointer">🔄 Refresh</button></div>`;
  // Prayers
  if(pr.length){
    h+=`<div class="sl">🙏 Daily prayers${G.prayerCity?` · 📍${G.prayerCity}`:''}</div><div class="pgrid">`;
    pr.forEach((p,pi)=>{const done=!!log.prayers[p.n];const t=G.prayerTimes?.[p.n]||p.t;const next=!done&&G.prayerTimes?.[p.n]&&isNP(pi,pr,log);h+=`<div class="pcard${done?' done':''}${next?' next':''}" onclick="tapP('${p.n}')"><div><div style="font-size:13px;font-weight:600">${p.n}${next?'<span style="font-size:9px;background:var(--g);color:#fff;padding:1px 5px;border-radius:4px;margin-left:4px">NEXT</span>':''}</div><div style="font-size:11px;color:var(--t3)">${t}</div></div><div class="circ${done?' done':''}">${done?'✓':''}</div></div>`;});
    h+=`</div>`;
  }
  // Tasks
  const daily=G.tasks.filter(t=>t.cat==='daily'&&(!t.showerOnly||SHD.includes(dow)));
  const bonus=G.tasks.filter(t=>t.cat==='bonus');
  h+=`<div class="sl">📋 Daily tasks</div>`;
  daily.forEach(t=>h+=taskHtml(t,log));
  if(bonus.length){h+=`<div class="sl">⭐ Bonus tasks</div>`;bonus.forEach(t=>h+=taskHtml(t,log));}
  document.getElementById('k-body').innerHTML=h;
}

function taskHtml(t,log){
  const status=log.tasks[t.id]||'none';
  const ticked=!!log.ticked[t.id];
  const photo=log.photos?.[t.id];
  // Issue 5: rejected = red
  let cls='tr';
  if(status==='approved')cls+=' done';
  else if(status==='pending')cls+=' pend';
  else if(status==='rejected')cls+=' rejected';
  const sub=status==='approved'?`Approved ✓ · +${t.stars}⭐`:status==='pending'?'⏳ Waiting for parent':status==='rejected'?'❌ Rejected — tap to resubmit':`+${t.stars}⭐`;
  const subCls=status==='rejected'?'tsub red':'tsub';
  let inner=`<div class="tname">${t.name}</div><div class="${subCls}">${sub}</div>`;
  // Show proof buttons for none/rejected
  if(status==='none'||status==='rejected'){
    inner+=`<div class="proof-area"><div class="proof-btns">
      <div class="pbtn tick${ticked?' active':''}" onclick="tapTick('${t.id}')">${ticked?'✅ Ticked':'☐ Tick done'}</div>
      <div class="pbtn photo${photo?' active':''}" onclick="tapPhoto('${t.id}')">${photo?'📷 Change':'📷 Add photo'}</div>
    </div>`;
    if(photo)inner+=`<img class="proof-img" src="${photo}"/>`;
    // Issue 5: resubmit button for rejected
    if(status==='rejected')inner+=`<button class="resubmit-btn" onclick="resubmit('${t.id}')">↩ Resubmit to parent</button>`;
    inner+=`</div>`;
  } else if(status==='approved'){
    if(photo)inner+=`<img class="proof-img" src="${photo}" style="margin-top:6px"/>`;
  }
  const ico=status==='approved'?'<div class="circ done">✓</div>':status==='pending'?'<div class="circ pend">⏳</div>':status==='rejected'?'<div class="circ rejected">✗</div>':'';
  return `<div class="${cls}"><span class="tico">${t.ico}</span><div class="tinfo">${inner}</div>${ico}</div>`;
}

// ── TASK ACTIONS ──────────────────────────────────────
window.tapTick=function(id){
  const kid=G.kid;if(!kid)return;
  const lg=getLog(kid.id,today());
  if(lg.tasks[id]==='approved')return;
  lg.ticked[id]=!lg.ticked[id];
  if(!lg.ticked[id]&&!lg.photos?.[id]){lg.tasks[id]='none';}
  renderKid();
  saveLog(kid.id,today());
};
window.tapPhoto=function(id){
  const kid=G.kid;if(!kid)return;
  const lg=getLog(kid.id,today());
  if(lg.tasks[id]==='approved')return;
  // Issue 3: Request camera permission
  openCamera(async dataUrl=>{
    // Show immediately (local)
    if(!lg.photos)lg.photos={};
    lg.photos[id]=dataUrl;
    renderKid();
    // Upload to Firebase Storage (async)
    const url=await uploadPhoto(kid.id,id,dataUrl);
    if(url!==dataUrl){
      // Use storage URL
      if(!lg.photoUrls)lg.photoUrls={};
      lg.photoUrls[id]=url;
      lg.photos[id]=url;
    }
    saveLog(kid.id,today());
  });
};
window.resubmit=function(id){
  // Issue 5: resubmit rejected task
  const kid=G.kid;if(!kid)return;
  const lg=getLog(kid.id,today());
  if(lg.tasks[id]!=='rejected')return;
  const task=G.tasks.find(t=>t.id===id);if(!task)return;
  lg.tasks[id]='pending';
  // Add back to pending
  const ex=G.pending.find(p=>p.kidId===kid.id&&p.tid===id&&p.date===today());
  if(!ex)G.pending.push({kidId:kid.id,kidName:kid.name,kidPhoto:kid.photo,kidEmoji:kid.emoji,kidColor:kid.color,task,tid:id,date:today(),time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),photo:lg.photos?.[id]||null,ticked:!!lg.ticked?.[id]});
  renderKid();
  saveLog(kid.id,today());
};
window.tapP=function(name){const kid=G.kid;if(!kid)return;const lg=getLog(kid.id,today());lg.prayers[name]=!lg.prayers[name];renderKid();saveLog(kid.id,today());};
window.submitDay=()=>alert('Day submitted! ⭐\nYour parent will review and approve your tasks.');
window.refreshKid=async()=>{
  if(!G.kid||!G.pUid)return;
  try{
    const snap=await getDoc(doc(db,'parents',G.pUid));
    if(snap.exists()){const d=snap.data();G.kids=d.kids||G.kids;G.tasks=d.tasks||G.tasks;G.rewards=d.rewards||G.rewards;if(!G.kids.find(k=>k.id===G.kid.id)){alert('Your account has been removed.');G.kid=null;SS('s-home');renderHome();return;}}
    await loadLogs(G.kid.id);
  }catch(e){console.error('refresh',e);}
  renderKid();
};

    G.kids.forEach(k=>{const ws=wStars(k.id);const ms=mStars(k.id);h+=`<div style="font-size:13px;font-weight:600;margin:10px 0 6px;display:flex;align-items:center;gap:8px">${avDiv(k.photo,k.emoji||'👦',k.color||'#1D9E75',24)}${k.name} · Week ${ws}⭐ · Month ${ms}⭐</div>`;[...G.rewards].sort((a,b)=>a.stars-b.stars).forEach(r=>{const ri=G.rewards.indexOf(r);const c=r.period==='month'?ms:ws;const ok=c>=r.stars;const pct=Math.min(100,Math.round(c/r.stars*100));h+=`<div class="rcard${ok&&!r.given?' unlocked':r.given?' given':''}"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px"><div style="font-size:13px;font-weight:600">${r.given?'✅':r.claimed?'🎯':ok?'🏆':'🔒'} ${r.name}</div><div style="display:flex;gap:4px"><button class="btn ib" onclick="openRF(${ri})">✏️</button><button class="btn ib dan" onclick="delR(${ri})">🗑️</button></div></div><div class="pb" style="margin-bottom:4px"><div class="pbf" style="width:${pct}%"></div></div><div style="font-size:11px;color:var(--t3)">${r.given?'✅ Given':r.claimed?'🎯 '+r.claimedBy+' chose this':ok?'Unlocked!':c+'/'+r.stars} · ${r.period==='month'?'Monthly':'Weekly'}${r.type==='money'?' · 💰 '+G.currency+' '+r.amount:''}</div></div>`;});});
    pc.innerHTML=h;return;
  }

};

window.openTF=id=>{const t=id?G.tasks.find(x=>x.id===id):null;G.editTask=id||null;let h=`<div class="sl">${t?'Edit':'New'} task</div><div class="ff"><label>Icon</label><input id="tfi" maxlength="4" value="${t?t.ico:''}" placeholder="📚"/></div><div class="ff"><label>Name</label><input id="tfn" value="${t?t.name:''}" placeholder="e.g. Read 20 min"/></div><div class="ff"><label>Category</label><select id="tfc"><option value="daily"${!t||t.cat==='daily'?' selected':''}>Daily</option><option value="bonus"${t&&t.cat==='bonus'?' selected':''}>Bonus</option></select></div><div class="ff"><label>Stars</label><select id="tfs"><option value="1"${!t||t.stars==1?' selected':''}>1</option><option value="2"${t&&t.stars==2?' selected':''}>2</option><option value="3"${t&&t.stars==3?' selected':''}>3</option></select></div><div style="display:flex;gap:8px;margin-top:10px">${t?`<button class="btn dan" onclick="delT('${t.id}');pTab('tasks')">Delete</button>`:''}<button class="btn pri" onclick="saveT()">Save</button></div>`;document.getElementById('p-body').innerHTML=h;};
window.saveT=()=>{const i=document.getElementById('tfi').value.trim()||'📌';const n=document.getElementById('tfn').value.trim();if(!n){alert('Enter name.');return;}const c=document.getElementById('tfc').value;const s=parseInt(document.getElementById('tfs').value);if(G.editTask){const t=G.tasks.find(x=>x.id===G.editTask);if(t){t.ico=i;t.name=n;t.cat=c;t.stars=s;}}else G.tasks.push({id:uid(),ico:i,name:n,cat:c,stars:s});G.editTask=null;saveP();pTab('tasks');};
window.delT=id=>{if(!confirm('Delete task?'))return;G.tasks=G.tasks.filter(t=>t.id!==id);saveP();pTab('tasks');};

let _eki=null;
window.editKidAv=ki=>{_eki=ki;const k=G.kids[ki];let h=`<div style="text-align:center;margin-bottom:14px"><div style="font-size:15px;font-weight:600;margin-bottom:12px">Edit ${k.name}'s photo</div><div style="width:80px;height:80px;border-radius:50%;overflow:hidden;border:3px solid ${k.color||'var(--g)'};margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:34px;background:${k.color||'#1D9E75'}22" id="kap">${k.photo?`<img src="${k.photo}" style="width:100%;height:100%;object-fit:cover"/>`:k.emoji||'👦'}</div><button class="btn pri sm" onclick="openCamera(async d=>{const k=G.kids[_eki];try{const r=ref(storage,'avatars/${G.pUid}/'+k.id+'.jpg');await uploadString(r,d,'data_url');const u=await getDownloadURL(r);k.photo=u;}catch{k.photo=d;}k.emoji=null;const p=document.getElementById('kap');if(p)p.innerHTML='<img src=\\''+k.photo+'\\'style=\\'width:100%;height:100%;object-fit:cover\\'/>';})">📷 Upload photo</button></div><div class="sl">Or choose emoji</div><div class="emoji-grid">${KEMOJIS.map(e=>`<div class="emoji-opt${(k.emoji||'👦')===e?' selected':''}" onclick="setKE(this,'${e}')">${e}</div>`).join('')}</div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" onclick="pTab('kids')">Cancel</button><button class="btn pri" onclick="saveKAv()">Save</button></div>`;document.getElementById('p-body').innerHTML=h;};
window.setKE=(el,e)=>{document.querySelectorAll('#p-body .emoji-grid .emoji-opt').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');const k=G.kids[_eki];k.emoji=e;k.photo=null;const p=document.getElementById('kap');if(p)p.innerHTML=e;};

window.openRF=idx=>{G.editReward=idx;const r=idx!=null?G.rewards[idx]:null;document.getElementById('re-tit').textContent=r?'Edit reward':'Add reward';let h=`<div class="ff"><label>Name</label><input id="rfn" value="${r?r.name:''}" placeholder="e.g. Pizza night"/></div><div class="ff"><label>Stars required</label><input id="rfs" type="number" min="1" value="${r?r.stars:30}"/></div><div class="ff"><label>Period</label><div class="seg" id="rfp"><div class="segb${!r||r.period==='week'?' active':''}" onclick="setSeg('rfp',0)">📅 Weekly</div><div class="segb${r&&r.period==='month'?' active':''}" onclick="setSeg('rfp',1)">📆 Monthly</div></div></div><div class="ff"><label>Type</label><div class="seg" id="rft"><div class="segb${!r||r.type==='treat'?' active':''}" onclick="setSeg('rft',0);document.getElementById('rfm').style.display='none'">🎉 Treat</div><div class="segb${r&&r.type==='money'?' active':''}" onclick="setSeg('rft',1);document.getElementById('rfm').style.display='block'">💰 Cash</div></div></div><div id="rfm" style="display:${r&&r.type==='money'?'block':'none'}"><div class="ff"><label>Amount (${G.currency})</label><input id="rfa" type="number" value="${r&&r.amount?r.amount:''}"/></div><div class="ff"><label>Payment</label><select id="rfpy"><option value="cash">Cash</option><option value="transfer"${r&&r.payType==='transfer'?' selected':''}>Bank transfer</option><option value="wallet"${r&&r.payType==='wallet'?' selected':''}>STC Pay</option></select></div></div><div style="display:flex;gap:8px;margin-top:12px">${idx!=null?`<button class="btn dan" onclick="delR(${idx});pTab('rewards');SS('s-parent')">Delete</button>`:''}<button class="btn pri" onclick="saveR()">Save</button></div>`;document.getElementById('re-body').innerHTML=h;SS('s-redit');};
window.setSeg=(id,ai)=>document.querySelectorAll(`#${id} .segb`).forEach((b,i)=>b.classList.toggle('active',i===ai));
window.saveR=()=>{const n=document.getElementById('rfn').value.trim();if(!n){alert('Enter name.');return;}const s=parseInt(document.getElementById('rfs').value)||20;const period=document.querySelectorAll('#rfp .segb')[1].classList.contains('active')?'month':'week';const type=document.querySelectorAll('#rft .segb')[1].classList.contains('active')?'money':'treat';const amount=type==='money'?parseFloat(document.getElementById('rfa').value)||0:null;const payType=type==='money'?document.getElementById('rfpy').value:null;const obj={id:uid(),name:n,stars:s,period,type,amount,payType,given:false};if(G.editReward!=null)G.rewards[G.editReward]=obj;else G.rewards.push(obj);G.editReward=null;saveP();pTab('rewards');SS('s-parent');};

function renderRep(pc){let h=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px" id="rks">`;G.kids.forEach((k,i)=>{h+=`<div class="badge ${i===0?'pro':'free'}" style="cursor:pointer;padding:5px 12px" onclick="selRK('${k.id}')">${k.emoji||'👦'} ${k.name}</div>`;});h+=`</div><div id="rb"></div>`;pc.innerHTML=h;if(G.kids.length)selRK(G.kids[0].id);}
window.selRK=id=>{G.repKid=id;document.querySelectorAll('#rks .badge').forEach(b=>b.className='badge free');const k=G.kids.find(x=>x.id===id);const ab=Array.from(document.querySelectorAll('#rks .badge')).find(b=>b.textContent.includes(k?.name||''));if(ab)ab.className='badge pro';const rb=document.getElementById('rb');if(!rb)return;rb.innerHTML=`<div class="seg" id="rps"><div class="segb active" onclick="setRP('week')">📅 Weekly</div><div class="segb" onclick="setRP('month')">📆 Monthly</div></div><div id="rc"></div>`;setRP('week');};
window.setRP=p=>{document.querySelectorAll('#rps .segb').forEach((b,i)=>b.classList.toggle('active',(p==='week'&&i===0)||(p==='month'&&i===1)));genR(G.repKid,p);};
function genR(kidId,period){const kid=G.kids.find(k=>k.id===kidId);if(!kid)return;const keys=period==='week'?wkeys():mkeys();const pr=prayers();const td=today();let ts=0,pd=0,td2=0,tt=0,bd=0;keys.forEach(dk=>{ts+=calcStars(kidId,dk);const log=getLog(kidId,dk);let ap=pr.length>0;pr.forEach(p=>{if(!log.prayers[p.n])ap=false;});if(ap&&pr.length)pd++;G.tasks.filter(t=>t.cat==='daily').forEach(t=>{tt++;if(log.tasks[t.id]==='approved')td2++;});G.tasks.filter(t=>t.cat==='bonus').forEach(t=>{if(log.tasks[t.id]==='approved')bd++;});});const tp=tt?Math.round(td2/tt*100):0;const pp=pr.length?Math.round(pd/keys.length*100):null;const now=new Date();const dl=period==='week'?`${wkeys()[0]} → ${wkeys()[6]}`:`${now.toLocaleString('default',{month:'long'})} ${now.getFullYear()}`;const grade=tp>=90?'🥇 Excellent':tp>=70?'🥈 Very good':tp>=50?'🥉 Good':'💪 Keep going';const msg=tp>=90?`Outstanding ${period} from ${kid.name}!`:tp>=70?'Great effort!':tp>=50?'Progress — aim for more!':'Let\'s encourage more.';let h=`<div class="rphdr"><div style="font-size:17px;font-weight:700">⭐ ${kid.name}'s Report</div><div style="font-size:12px;opacity:.85;margin-top:3px">${period==='week'?'Weekly':'Monthly'} · ${dl}</div></div><div class="sgrid"><div class="scard"><div class="sgnum">${ts}</div><div class="sglbl">⭐ Stars</div></div><div class="scard"><div class="sgnum">${tp}%</div><div class="sglbl">📋 Tasks</div></div>`;if(pp!==null)h+=`<div class="scard"><div class="sgnum">${pp}%</div><div class="sglbl">🙏 Prayers</div></div>`;h+=`<div class="scard"><div class="sgnum">${bd}</div><div class="sglbl">⭐ Bonus</div></div></div>`;[{l:'Daily tasks',v:tp,max:100,u:'%'},{l:'Stars earned',v:ts,max:Math.max(ts,50),u:'⭐'}].forEach(b=>{const pct=b.max?Math.min(100,Math.round(b.v/b.max*100)):0;h+=`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--t2);margin-bottom:3px;font-weight:500"><span>${b.l}</span><span>${b.v}${b.u}</span></div><div class="pb"><div class="pbf" style="width:${pct}%"></div></div></div>`;});h+=`<div class="sl">Day by day</div><div class="dgrid">`;(period==='week'?keys:wkeys()).forEach((dk,i)=>{const s=calcStars(kidId,dk);h+=`<div class="dcell${dk===td?' today':''}"><div style="font-size:9px;color:var(--t3);font-weight:600">${DS[i]}</div><div style="font-size:13px;font-weight:700;color:var(--g)">${s}</div></div>`;});h+=`</div><div class="info g" style="text-align:center"><div style="font-size:20px;margin-bottom:4px">${grade}</div><div style="font-size:13px">${msg}</div></div>`;document.getElementById('rc').innerHTML=h;}

// ── PRAYER TIMES ──────────────────────────────────────
G.prayerTimes={};G.prayerCity='';
function isNP(idx,pr,log){if(!G.prayerTimes)return false;const now=new Date();const nm=now.getHours()*60+now.getMinutes();for(let i=0;i<pr.length;i++){if(log.prayers[pr[i].n])continue;const t=G.prayerTimes[pr[i].n];if(t){const[h,m]=t.split(':').map(Number);if((h*60+m)>=nm)return i===idx;}else return i===idx;break;}return false;}
async function initPT(){if(!G.prayOn||G.religion!=='islam')return;try{const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:6000}));const la=pos.coords.latitude.toFixed(4);const lo=pos.coords.longitude.toFixed(4);const d=new Date();const ds=`${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}`;const r=await fetch(`https://api.aladhan.com/v1/timings/${ds}?latitude=${la}&longitude=${lo}&method=4`);const data=await r.json();if(data.code===200){const t=data.data.timings;G.prayerTimes={Fajr:t.Fajr,Dhuhr:t.Dhuhr,Asr:t.Asr,Maghrib:t.Maghrib,Isha:t.Isha};G.prayerCity=data.data.meta.timezone?.split('/').pop().replace(/_/g,' ')||'';renderKid();}}catch{try{const d=new Date();const ds=`${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}`;const r=await fetch(`https://api.aladhan.com/v1/timingsByCity/${ds}?city=Riyadh&country=SA&method=4`);const data=await r.json();if(data.code===200){const t=data.data.timings;G.prayerTimes={Fajr:t.Fajr,Dhuhr:t.Dhuhr,Asr:t.Asr,Maghrib:t.Maghrib,Isha:t.Isha};G.prayerCity='Riyadh';renderKid();}}catch{}}}

ected':''}>Other</option></select></div></div>`;h+=`</div><div class="sl">Currency</div><div class="card"><div class="ff" style="margin:0"><select onchange="G.currency=this.value;saveP()"><option value="SAR"${G.currency==='SAR'?' selected':''}>SAR</option><option value="USD"${G.currency==='USD'?' selected':''}>USD</option><option value="GBP"${G.currency==='GBP'?' selected':''}>GBP</option><option value="AED"${G.currency==='AED'?' selected':''}>AED</option></select></div></div><div class="sl">Saved logins</div><div class="card"><button class="btn dan sm" onclick="localStorage.clear();alert('Cleared.');renderSettings()">Clear all saved logins</button></div>`;document.getElementById('set-body').innerHTML=h;};

 });
 saveP();

};
