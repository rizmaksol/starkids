<style>

// FIX 2: Each task gets its own inline label+input - most reliable on Android
// label element wrapping file input responds to tap without JS .click()
function tHtml(t,log){
const status=log.tasks[t.id]||'none';const ticked=!!log.ticked?.[t.id];const photo=log.photos?.[t.id];
let cls='tr';if(status==='approved')cls+=' done';else if(status==='pending')cls+=' pend';else if(status==='rej'||status==='rejected')cls+=' rej';
const sub=status==='approved'?`✅ Approved · +${t.stars}⭐`:status==='pending'?'⏳ Waiting for parent':(status==='rejected'||status==='rej')?'❌ Rejected — resubmit below':`Tap to complete · +${t.stars}⭐`;
const sc=(status==='rejected'||status==='rej')?'tsub red':'tsub';
let inner=`<div class="tname">${t.name}</div><div class="${sc}">${sub}</div>`;
if(status==='none'||status==='rejected'||status==='rej'){
// CRITICAL FIX 2: label wraps input so tapping label opens camera on Android
// This is the most reliable approach - no JS .click() needed
inner+=`<div class="proof-area"><div class="proof-row">
<div class="ptick${ticked?' on':''}" onclick="tTick('${t.id}')">${ticked?'✅ Ticked':'☐ Mark done'}</div>
<label class="pcam-label${photo?' on':''}" for="ph_${t.id}">${photo?'📷 Change photo':'📷 Take photo'}</label>
<input type="file" id="ph_${t.id}" name="ph_${t.id}" accept="image/*" capture="environment" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0" onchange="hPh(this,'${t.id}')"/>
</div>`;
if(photo)inner+=`<img class="proof-img" src="${photo}"/>`;
if(status==='rejected'||status==='rej')inner+=`<button class="resub-btn" onclick="reSub('${t.id}')">↩ Resubmit to parent</button>`;
inner+=`</div>`;
}else if(status==='approved'&&photo){inner+=`<img class="proof-img" src="${photo}" style="margin-top:6px"/>`;}
const ico=status==='approved'?'<div class="circ done">✓</div>':status==='pending'?'<div class="circ pend">⏳</div>':(status==='rejected'||status==='rej')?'<div class="circ rej">✗</div>':'';
return `<div class="${cls}"><span class="tico">${t.ico}</span><div class="tinfo">${inner}</div>${ico}</div>`;}

// FIX 2: Photo handler using onchange on inline input
window.hPh=function(inp,id){

const kid=G.kid;
if(!kid)return;

const file=inp.files && inp.files[0];
if(!file)return;

const reader=new FileReader();

reader.onload=function(ev){

    compress(ev.target.result,300,function(data){

        if(!lg.photos) lg.photos={};

        lg.photos[id]=data;

window.addK=()=>{const n=document.getElementById('kin');if(!n||!n.value.trim())return;const cols=['#1D9E75','#7F77DD','#D85A30','#378ADD','#D4537E'];G.kids.push({id:'k'+Date.now(),name:n.value.trim(),color:cols[G.kids.length%cols.length],code:rCode(),emoji:_nke,photo:null});n.value='';_nke='👦';saveP();pTab('kids');};
window.rgnC=id=>{const k=G.kids.find(x=>x.id===id);if(k){k.code=rCode();saveP();pTab('kids');}};
window.rmK=id=>{if(!confirm('Remove child? They will be logged out immediately.'))return;G.kids=G.kids.filter(k=>k.id!==id);saveP();pTab('kids');};
let _eki=null;
window.eKAv=ki=>{_eki=ki;const k=G.kids[ki];let h=`<div style="text-align:center;margin-bottom:14px"><div style="font-size:15px;font-weight:600;margin-bottom:12px">Edit ${k.name}'s photo</div><div style="width:80px;height:80px;border-radius:50%;overflow:hidden;border:3px solid ${k.color||'var(--g)'};margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:34px;background:${k.color||'#1D9E75'}22" id="ekap">${k.photo?`<img src="${k.photo}" style="width:100%;height:100%;object-fit:cover"/>`:k.emoji||'👦'}</div>`;
h+=`<label class="btn pri sm" style="cursor:pointer;display:inline-block">📷 Upload photo<input type="file" name="kid-av-photo" accept="image/*" capture="environment" style="display:none" onchange="hPKAv(this)"/></label></div>`;
h+=`<div class="sl">Or choose emoji</div><div class="emoji-grid">${KE.map(e=>`<div class="emoji-opt${(k.emoji||'👦')===e?' selected':''}" onclick="sKEP(this,'${e}')">${e}</div>`).join('')}</div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" onclick="pTab('kids')">Cancel</button><button class="btn pri" onclick="svKAv()">Save</button></div>`;document.getElementById('pb').innerHTML=h;};
window.hPKAv=function(inp){const file=inp.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{compress(ev.target.result,400,data=>{const k=G.kids[_eki];k.photo=data;k.emoji=null;const p=document.getElementById('ekap');if(p)p.innerHTML=`<img src="${data}" style="width:100%;height:100%;object-fit:cover"/>`;});};reader.readAsDataURL(file);inp.value='';};
window.sKEP=(el,e)=>{document.querySelectorAll('#pb .emoji-grid .emoji-opt').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');const k=G.kids[_eki];k.emoji=e;k.photo=null;const p=document.getElementById('ekap');if(p)p.innerHTML=e;};
window.svKAv=()=>{saveP();pTab('kids');};
window.oRF=idx=>{G.editReward=idx;const r=idx!=null?G.rewards[idx]:null;document.getElementById('re-t').textContent=r?'Edit reward':'Add reward';let h=`<div class="ff"><label>Name</label><input id="rfn" value="${r?r.name:''}" placeholder="e.g. Pizza night"/></div><div class="ff"><label>Stars required</label><input id="rfs" type="number" min="1" value="${r?r.stars:30}"/></div><div class="ff"><label>Period</label><div class="seg" id="rfp"><div class="segb${!r||r.period==='week'?' active':''}" onclick="sSeg('rfp',0)">📅 Weekly</div><div class="segb${r&&r.period==='month'?' active':''}" onclick="sSeg('rfp',1)">📆 Monthly</div></div></div><div class="ff"><label>Type</label><div class="seg" id="rft"><div class="segb${!r||r.type==='treat'?' active':''}" onclick="sSeg('rft',0);document.getElementById('rfm').style.display='none'">🎉 Treat</div><div class="segb${r&&r.type==='money'?' active':''}" onclick="sSeg('rft',1);document.getElementById('rfm').style.display='block'">💰 Cash</div></div></div><div id="rfm" style="display:${r&&r.type==='money'?'block':'none'}"><div class="ff"><label>Amount (${G.currency})</label><input id="rfa" type="number" value="${r&&r.amount?r.amount:''}"/></div><div class="ff"><label>Payment</label><select id="rfpy"><option value="cash">Cash</option><option value="transfer"${r&&r.payType==='transfer'?' selected':''}>Bank transfer</option><option value="wallet"${r&&r.payType==='wallet'?' selected':''}>STC Pay</option></select></div></div><div style="display:flex;gap:8px;margin-top:12px">${idx!=null?`<button class="btn dan" onclick="dlR(${idx});pTab('rewards');SS('s-parent')">Delete</button>`:''}<button class="btn pri" onclick="svR()">Save</button></div>`;document.getElementById('reb').innerHTML=h;SS('s-re');};
window.sSeg=(id,ai)=>document.querySelectorAll(`#${id} .segb`).forEach((b,i)=>b.classList.toggle('active',i===ai));
window.svR=()=>{const n=document.getElementById('rfn').value.trim();if(!n){alert('Enter name.');return;}const s=parseInt(document.getElementById('rfs').value)||20;const period=document.querySelectorAll('#rfp .segb')[1].classList.contains('active')?'month':'week';const type=document.querySelectorAll('#rft .segb')[1].classList.contains('active')?'money':'treat';const amount=type==='money'?parseFloat(document.getElementById('rfa').value)||0:null;const payType=type==='money'?document.getElementById('rfpy').value:null;const obj={id:uid(),name:n,stars:s,period,type,amount,payType,given:false};if(G.editReward!=null)G.rewards[G.editReward]=obj;else G.rewards.push(obj);G.editReward=null;saveP();pTab('rewards');SS('s-parent');};
window.dlR=idx=>{if(!confirm('Delete?'))return;G.rewards.splice(idx,1);saveP();pTab('rewards');};
// Report
function rRep(pc){let h=`<div class="kid-tabs" id="rks">`;G.kids.forEach((k,i)=>{h+=`<div class="kid-tab${i===0?' active':''}" onclick="sRK('${k.id}',this)">${avD(k.photo,k.emoji||'👦',k.color||'#1D9E75',22)} ${k.name}</div>`;});h+=`</div><div id="rb"></div>`;pc.innerHTML=h;if(G.kids.length)sRK(G.kids[0].id,document.querySelector('#rks .kid-tab'));}
window.sRK=(id,el)=>{G.repKid=id;document.querySelectorAll('#rks .kid-tab').forEach(b=>b.classList.remove('active'));if(el)el.classList.add('active');const rb=document.getElementById('rb');if(!rb)return;rb.innerHTML=`<div class="seg" id="rps"><div class="segb active" onclick="sRP('week')">📅 Weekly</div><div class="segb" onclick="sRP('month')">📆 Monthly</div></div><div id="rc"></div>`;sRP('week');};
window.sRP=p=>{document.querySelectorAll('#rps .segb').forEach((b,i)=>b.classList.toggle('active',(p==='week'&&i===0)||(p==='month'&&i===1)));gRep(G.repKid,p);};
function gRep(kidId,period){const kid=G.kids.find(k=>k.id===kidId);if(!kid)return;const keys=period==='week'?wk():mk();const pr=Pr();const td=today();let ts=0,pd=0,td2=0,tt=0,bd=0;keys.forEach(dk=>{ts+=cS(kidId,dk);const log=gLog(kidId,dk);let ap=pr.length>0;pr.forEach(p=>{if(!log.prayers[p.n])ap=false;});if(ap&&pr.length)pd++;G.tasks.filter(t=>t.cat==='daily').forEach(t=>{tt++;if(log.tasks[t.id]==='approved')td2++;});G.tasks.filter(t=>t.cat==='bonus').forEach(t=>{if(log.tasks[t.id]==='approved')bd++;});});const tp=tt?Math.round(td2/tt*100):0;const pp=pr.length?Math.round(pd/keys.length*100):null;const now=new Date();const dl=period==='week'?`${wk()[0]} → ${wk()[6]}`:`${now.toLocaleString('default',{month:'long'})} ${now.getFullYear()}`;const grade=tp>=90?'🥇 Excellent':tp>=70?'🥈 Very good':tp>=50?'🥉 Good':'💪 Keep going';const msg=tp>=90?'Outstanding!':tp>=70?'Great effort!':tp>=50?'Good progress!':"Let's encourage more.";let h=`<div class="rphdr"><div style="font-size:17px;font-weight:700">⭐ ${kid.name}'s Report</div><div style="font-size:12px;opacity:.85;margin-top:3px">${period==='week'?'Weekly':'Monthly'} · ${dl}</div></div><div class="sgrid"><div class="scard"><div class="sgnum">${ts}</div><div class="sglbl">⭐ Stars</div></div><div class="scard"><div class="sgnum">${tp}%</div><div class="sglbl">📋 Tasks</div></div>`;if(pp!==null)h+=`<div class="scard"><div class="sgnum">${pp}%</div><div class="sglbl">🙏 Prayers</div></div>`;h+=`<div class="scard"><div class="sgnum">${bd}</div><div class="sglbl">⭐ Bonus</div></div></div>`;[{l:'Daily tasks',v:tp,max:100,u:'%'},{l:'Stars earned',v:ts,max:Math.max(ts,50),u:'⭐'}].forEach(b=>{const pct=b.max?Math.min(100,Math.round(b.v/b.max*100)):0;h+=`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--t2);margin-bottom:3px;font-weight:500"><span>${b.l}</span><span>${b.v}${b.u}</span></div><div class="pb"><div class="pbf" style="width:${pct}%"></div></div></div>`;});h+=`<div class="sl">Day by day</div><div class="dgrid">`;(period==='week'?keys:wk()).forEach((dk,i)=>{const s=cS(kidId,dk);h+=`<div class="dcell${dk===td?' today':''}"><div style="font-size:9px;color:var(--t3);font-weight:600">${DS[i]}</div><div style="font-size:13px;font-weight:700;color:var(--g)">${s}</div></div>`;});h+=`</div><div class="info g" style="text-align:center"><div style="font-size:20px;margin-bottom:4px">${grade}</div><div style="font-size:13px">${msg}</div></div>`;document.getElementById('rc').innerHTML=h;}
// Settings
window.rSet=()=>{const PE=['👨‍👩‍👧','👩‍👧','👨‍👧','👩','👨','👩‍💼','👨‍💼'];let h=`<div class="sl">Your profile</div><div class="card" style="text-align:center"><div style="width:80px;height:80px;border-radius:50%;overflow:hidden;border:3px solid var(--g);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:34px;background:#1D9E7522">${G.pPhoto?`<img src="${G.pPhoto}" style="width:100%;height:100%;object-fit:cover"/>`:G.pEmoji||'👨‍👩‍👧'}</div><div style="font-size:15px;font-weight:600;margin-bottom:2px">${G.pData?.name||'Parent'}</div><div style="font-size:12px;color:var(--t3);margin-bottom:10px">${auth.currentUser?.email||''}</div><label class="btn sm" style="cursor:pointer;display:inline-block;margin-bottom:10px">📷 Change photo<input type="file" name="parent-profile-photo" accept="image/*" capture="environment" style="display:none" onchange="hPPh(this)"/></label><div class="emoji-grid">${PE.map(e=>`<div class="emoji-opt${(G.pEmoji||'👨‍👩‍👧')===e?' selected':''}" onclick="sPE('${e}')">${e}</div>`).join('')}</div><button class="btn dan" style="width:100%;margin-top:10px" onclick="doOut()">Sign out</button></div>`;h+=`<div class="sl">Prayer module</div><div class="card"><div class="togrow"><div><div style="font-size:13px;font-weight:600">Enable prayer section</div></div><button class="tog ${G.prayOn?'on':'off'}" onclick="G.prayOn=!G.prayOn;saveP();rSet()"></button></div>`;if(G.prayOn)h+=`<div style="margin-top:10px"><div class="ff" style="margin:0"><label>Religion</label><select id="s-rel" onchange="G.religion=this.value;saveP()"><option value="islam"${G.religion==='islam'?' selected':''}>Islam — 5 prayers</option><option value="christian"${G.religion==='christian'?' selected':''}>Christian — 3 times</option><option value="other"${G.religion==='other'?' selected':''}>Other</option></select></div></div>`;h+=`</div><div class="sl">Currency</div><div class="card"><div class="ff" style="margin:0"><select onchange="G.currency=this.value;saveP()"><option value="SAR"${G.currency==='SAR'?' selected':''}>SAR</option><option value="USD"${G.currency==='USD'?' selected':''}>USD</option><option value="GBP"${G.currency==='GBP'?' selected':''}>GBP</option><option value="AED"${G.currency==='AED'?' selected':''}>AED</option></select></div></div><div class="sl">Saved logins</div><div class="card"><button class="btn dan sm" onclick="localStorage.clear();alert('Cleared.');rSet()">Clear all saved logins</button></div>`;document.getElementById('setb').innerHTML=h;};
window.hPPh=function(inp){const file=inp.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{compress(ev.target.result,300,data=>{G.pPhoto=data;G.pEmoji=null;saveP();rSet();const a=document.getElementById('p-av');if(a)a.innerHTML=avD(G.pPhoto,G.pEmoji,'#1D9E75',36);});};reader.readAsDataURL(file);inp.value='';};
window.sPE=e=>{G.pEmoji=e;G.pPhoto=null;saveP();rSet();const a=document.getElementById('p-av');if(a)a.innerHTML=avD(null,G.pEmoji,'#1D9E75',36);};
// Init
rHome();bCI();setAM('in');rAuth();
</script>
